# GEÇİCİ — herkese açık bir X paylaşımını okumak için. Secret kullanmaz. İş bitince silinecek.
name: X Post Read

on:
  push:
    branches: [claude/voltan-orchestrator-agent-a30dgt]
    paths: ['.github/workflows/x-post-read.yml']

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Makale gorselleri (OCR)
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y tesseract-ocr >/dev/null
          curl -sS -m 25 -A 'Mozilla/5.0' "https://api.fxtwitter.com/vengeonsp/status/2118661285868863578" -o t.json
          python3 - <<'PY' > items.tsv
          import json, re
          d = json.load(open('t.json'))
          a = d['tweet']['article']
          em = a['content'].get('entityMap', {})
          if isinstance(em, list):
              em = {str(e.get('key')): e.get('value', e) for e in em}
          def walk(o, f):
              if isinstance(o, dict):
                  for k, v in o.items():
                      f(k, v); walk(v, f)
              elif isinstance(o, list):
                  for v in o: walk(v, f)
          url_of = {}
          for m in a.get('media_entities', []) or []:
              urls, ids = [], []
              walk(m, lambda k, v: urls.append(v) if isinstance(v, str) and 'pbs.twimg.com' in v else None)
              walk(m, lambda k, v: ids.append(str(v)) if re.search(r'(^|_)id$|media_?id|media_key', k, re.I) and isinstance(v, (str, int)) else None)
              for i in ids:
                  if urls: url_of[i] = urls[0]
          section = 'Giris'
          for b in a['content']['blocks']:
              if b.get('type', '').startswith('header'):
                  section = b['text']
              if b.get('type') != 'atomic':
                  continue
              for r in b.get('entityRanges', []):
                  e = em.get(str(r.get('key')), {})
                  found = []
                  walk(e, lambda k, v: found.append((k, str(v))) if isinstance(v, (str, int)) and k not in ('mutability',) else None)
                  mids = [v for k, v in found if re.search(r'media_?id', k, re.I)]
                  u = next((url_of[m] for m in mids if m in url_of), '')
                  extra = ' '.join(f'{k}={v}' for k, v in found if k not in ('localMediaId', 'mediaCategory') and not re.search(r'media_?id', k, re.I))[:300]
                  print(f"{section}\t{e.get('type', '?')}\t{u}\t{extra}")
          PY
          echo "atomik oge sayisi: $(wc -l < items.tsv)"
          n=0
          while IFS=$'\t' read -r sec typ url extra; do
            n=$((n+1))
            echo "=================== [$n] BOLUM: $sec | TUR: $typ | $extra"
            [ -n "$url" ] || continue
            curl -sS -m 25 -o img "$url" || continue
            tesseract img - 2>/dev/null | sed '/^\s*$/d' | head -c 3500
          done < items.tsv

      - name: ChatSEO fiyat ve gizlilik sayfalari
        run: |
          curl -sSL -m 25 -A 'Mozilla/5.0' -o home.html https://chatseo.app/
          grep -oE 'href="[^"]+"' home.html | sed -E 's/href="([^"]+)"/\1/' | grep -iE 'pric|tarif|privacy|confidential|legal|terms|cgu|cgv|mention|about|dpa|gdpr|rgpd' | sed -E 's#^/#https://chatseo.app/#' | sort -u | head -12 > cl.txt
          cat cl.txt
          while read -r u; do
            echo "=================== $u"
            curl -sSL -m 25 -A 'Mozilla/5.0' -o p.html -w 'HTTP %{http_code} -> %{url_effective}\n' "$u" || continue
            python3 - <<'PY'
          import re, html
          s = open('p.html', encoding='utf-8', errors='ignore').read()
          t = re.sub(r'<script.*?</script>|<style.*?</style>', ' ', s, flags=re.S | re.I)
          t = html.unescape(re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', t)))
          print('TEXT :', t[:3000])
          for kw in ['€', '$', 'host', 'server', 'Search Console', 'subprocessor', 'sous-traitant', 'OpenAI', 'Anthropic', 'transfer', 'Turkish', 'Türkçe']:
              for m in list(re.finditer(re.escape(kw), t))[:2]:
                  print(f'  [{kw}] ...{t[max(0, m.start()-150):m.end()+150]}...')
          PY
          done < cl.txt
