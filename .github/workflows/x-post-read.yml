# GEÇİCİ — herkese açık bir X paylaşımını okumak için (oturum ağı X'e kapalı).
# Secret kullanmaz; yalnızca kamuya açık içeriği yazdırır. İş bitince silinecek.
name: X Post Read

on:
  push:
    branches: [claude/voltan-orchestrator-agent-a30dgt]
    paths: ['.github/workflows/x-post-read.yml']

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Makale metni (fxtwitter)
        run: |
          curl -sS -m 25 -A 'Mozilla/5.0' "https://api.fxtwitter.com/nicholasdulait/status/2117194945668714566" -o t.json
          jq -r '"YAZAR: \(.tweet.author.name) (@\(.tweet.author.screen_name))  TARIH: \(.tweet.created_at)",
                 "BEGENI: \(.tweet.likes)  RT: \(.tweet.retweets)  YANIT: \(.tweet.replies)  GORUNTULENME: \(.tweet.views)",
                 "TWEET METNI: \(.tweet.text)",
                 "MAKALE BASLIGI: \(.tweet.article.title // "-")",
                 "MAKALE OZETI: \(.tweet.article.preview_text // "-")",
                 "----- MAKALE GOVDESI -----"' t.json
          jq -r '.tweet.article.content.blocks[]? | (if .type == "header-one" or .type == "header-two" then "\n## " + .text elif .type == "unordered-list-item" or .type == "ordered-list-item" then "- " + .text elif .type == "atomic" then "[gorsel/ek]" else .text end)' t.json | sed '/^$/N;/^\n$/D'
          echo "----- ANAHTARLAR -----"; jq -r '.tweet.article | keys? // [] | join(",")' t.json
