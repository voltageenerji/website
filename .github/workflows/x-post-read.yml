# GEÇİCİ — herkese açık bir X paylaşımını okumak için. Secret kullanmaz. İş bitince silinecek.
name: X Post Read

on:
  push:
    branches: [claude/voltan-orchestrator-agent-a30dgt]
    paths: ['.github/workflows/x-post-read.yml']

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Makale gorselleri sirali (OCR)
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y tesseract-ocr >/dev/null
          curl -sS -m 25 -A 'Mozilla/5.0' "https://api.fxtwitter.com/alg0_slayer/status/2119006202323439621" -o t.json
          python3 - <<'PY' > items.tsv
          import json, re
          d = json.load(open('t.json'))
          a = d['tweet']['article']
          em = a['content'].get('entityMap', {})
          if isinstance(em, list):
              em = {str(e.get('key')): e.get('value', e) for e in em}
          def walk(o, f):
              if isinstance(o, dict):
                  for k, v in o.items():
                      f(k, v); walk(v, f)
              elif isinstance(o, list):
                  for v in o: walk(v, f)
          url_of = {}
          for m in a.get('media_entities', []) or []:
              urls, ids = [], []
              walk(m, lambda k, v: urls.append(v) if isinstance(v, str) and 'pbs.twimg.com' in v else None)
              walk(m, lambda k, v: ids.append(str(v)) if re.search(r'(^|_)id$|media_?id|media_key', k, re.I) and isinstance(v, (str, int)) else None)
              for i in ids:
                  if urls: url_of[i] = urls[0]
          section = 'Giris'
          for b in a['content']['blocks']:
              if b.get('type', '').startswith('header'):
                  section = b['text'][:40]
              if b.get('type') != 'atomic':
                  continue
              for r in b.get('entityRanges', []):
                  e = em.get(str(r.get('key')), {})
                  found = []
                  walk(e, lambda k, v: found.append((k, str(v))) if isinstance(v, (str, int)) and k not in ('mutability',) else None)
                  mids = [v for k, v in found if re.search(r'media_?id', k, re.I)]
                  u = next((url_of[m] for m in mids if m in url_of), '')
                  extra = ' '.join(f'{k}={v}' for k, v in found if k not in ('localMediaId', 'mediaCategory') and not re.search(r'media_?id', k, re.I))[:200]
                  print(f"{section}\t{e.get('type', '?')}\t{u}\t{extra}")
          PY
          echo "atomik oge sayisi: $(wc -l < items.tsv)"
          n=0
          while IFS=$'\t' read -r sec typ url extra; do
            n=$((n+1))
            echo "=================== [$n] BOLUM: $sec | TUR: $typ | $extra"
            [ -n "$url" ] || continue
            curl -sS -m 25 -o img "$url" || continue
            tesseract img - 2>/dev/null | sed '/^\s*$/d' | head -c 2500
          done < items.tsv

      - name: Yazar hesaplari (fxtwitter profil)
        run: |
          for h in alg0_slayer vengeonsp nicholasdulait; do
            curl -sS -m 25 -A 'Mozilla/5.0' "https://api.fxtwitter.com/$h" -o u.json || continue
            jq -c '{h: .user.screen_name, name: .user.name, joined: .user.joined, followers: .user.followers, following: .user.following, tweets: .user.tweets, likes: .user.likes, desc: .user.description, web: (.user.website.url // .user.website)}' u.json || head -c 300 u.json
          done

      - name: ChatSEO hakkinda ve ortaklik sayfalari
        run: |
          curl -sSL -m 25 -A 'Mozilla/5.0' -o home.html https://chatseo.app/
          grep -oE 'href="[^"]+"' home.html | sed -E 's/href="([^"]+)"/\1/' | grep -iE 'about|affiliate|partner|team|legal|mention' | sed -E 's#^/#https://chatseo.app/#' | sort -u | head -6 > cl.txt
          cat cl.txt
          while read -r u; do
            echo "=================== $u"
            curl -sSL -m 25 -A 'Mozilla/5.0' -o p.html -w 'HTTP %{http_code} -> %{url_effective}\n' "$u" || continue
            python3 - <<'PY'
          import re, html
          s = open('p.html', encoding='utf-8', errors='ignore').read()
          t = re.sub(r'<script.*?</script>|<style.*?</style>', ' ', s, flags=re.S | re.I)
          t = html.unescape(re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', t)))
          print('TEXT :', t[:2000])
          for kw in ['commission', '%', 'Slayer', 'slayer', 'founder', 'SIREN', 'SAS', 'Paris', 'Rémi', 'Remi']:
              for m in list(re.finditer(re.escape(kw), t))[:2]:
                  print(f'  [{kw}] ...{t[max(0, m.start()-120):m.end()+120]}...')
          PY
          done < cl.txt

      - name: Iddia dogrulama (OpenAI, Google, Bing, Notion, Citeme)
        run: |
          show() { python3 - "$1" "$2" <<'PY'
          import re, html, sys
          s = open(sys.argv[1], encoding='utf-8', errors='ignore').read()
          m = re.search(r'<title[^>]*>(.*?)</title>', s, re.S | re.I)
          print('TITLE:', html.unescape(m.group(1).strip())[:150] if m else '')
          t = re.sub(r'<script.*?</script>|<style.*?</style>', ' ', s, flags=re.S | re.I)
          t = html.unescape(re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', t)))
          for kw in sys.argv[2].split('|'):
              for m in list(re.finditer(re.escape(kw), t, re.I))[:2]:
                  print(f'  [{kw}] ...{t[max(0, m.start()-200):m.end()+250]}...')
          PY
          }
          for u in https://developers.openai.com/api/docs/bots https://platform.openai.com/docs/bots; do
            echo "=================== $u"
            curl -sSL -m 25 -A 'Mozilla/5.0' -o p.html -w 'HTTP %{http_code} -> %{url_effective}\n' "$u" && show p.html 'OAI-SearchBot|opted out|independent|ChatGPT-User'
          done
          u=https://developers.google.com/search/docs/appearance/ai-features
          echo "=================== $u"
          curl -sSL -m 25 -A 'Mozilla/5.0' -o p.html -w 'HTTP %{http_code} -> %{url_effective}\n' "$u" && show p.html 'fan-out|llms.txt|special|additional requirements|Last updated'
          u=https://blogs.bing.com/webmaster
          echo "=================== $u"
          curl -sSL -m 25 -A 'Mozilla/5.0' -o p.html -w 'HTTP %{http_code} -> %{url_effective}\n' "$u" && show p.html 'AI Performance|grounding'
          grep -oE 'href="[^"]*(ai-performance|AI-Performance|grounding)[^"]*"' p.html | sort -u | head -3
          bl=$(grep -oE 'href="[^"]*(ai-performance|AI-Performance|grounding)[^"]*"' p.html | head -1 | sed -E 's/href="([^"]+)"/\1/; s#^/#https://blogs.bing.com/#')
          if [ -n "$bl" ]; then echo "=================== $bl"; curl -sSL -m 25 -A 'Mozilla/5.0' -o p.html -w 'HTTP %{http_code} -> %{url_effective}\n' "$bl" && show p.html 'grounding quer|citation|Copilot|country|available'; fi
          echo "=================== Notion sayfa basliklari"
          for id in 3ca82f65-b36f-8118-8db3-d90ec2b0cec9 3c782f65-b36f-812d-91e0-ffa87005e874; do
            curl -sS -m 25 -X POST -H 'Content-Type: application/json' -A 'Mozilla/5.0' \
              -d "{\"page\":{\"id\":\"$id\"},\"limit\":60,\"cursor\":{\"stack\":[]},\"chunkNumber\":0,\"verticalColumns\":false}" \
              https://www.notion.so/api/v3/loadCachedPageChunk -o n.json -w "notion $id HTTP %{http_code}\n" || continue
            jq -r '[.recordMap.block[]?.value | (.value // .) | select(.properties.title) | "\(.type): " + ([.properties.title[][0]] | join(""))] | .[:45][]' n.json 2>/dev/null | cut -c1-220 || head -c 300 n.json
          done
          echo "=================== Citeme"
          for u in https://citeme.ai https://citeme.app https://www.citeme.io; do
            curl -sSL -m 15 -A 'Mozilla/5.0' -o p.html -w "$u HTTP %{http_code} -> %{url_effective}\n" "$u" && show p.html 'ChatSEO|chatseo' || true
          done
