# GEÇİCİ — herkese açık bir X paylaşımını okumak için. Secret kullanmaz. İş bitince silinecek.
name: X Post Read

on:
  push:
    branches: [claude/voltan-orchestrator-agent-a30dgt]
    paths: ['.github/workflows/x-post-read.yml']

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Iddia dogrulama (Google yorum ve link politikalari)
        run: |
          show() { python3 - "$1" "$2" <<'PY2'
          import re, html, sys
          s = open(sys.argv[1], encoding='utf-8', errors='ignore').read()
          m = re.search(r'<title[^>]*>(.*?)</title>', s, re.S | re.I)
          print('TITLE:', html.unescape(m.group(1).strip())[:150] if m else '')
          t = re.sub(r'<script.*?</script>|<style.*?</style>', ' ', s, flags=re.S | re.I)
          t = html.unescape(re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', t)))
          print('LEN  :', len(t))
          for kw in sys.argv[2].split('|'):
              for m in list(re.finditer(re.escape(kw), t, re.I))[:2]:
                  print(f'  [{kw}] ...{t[max(0, m.start()-220):m.end()+260]}...')
          PY2
          }
          get() { echo "=================== $1"; curl -sSL -m 25 -A 'Mozilla/5.0' -H 'Accept-Language: en' -o p.html -w 'HTTP %{http_code} -> %{url_effective}\n' "$1" && show p.html "$2" || true; }
          get 'https://support.google.com/contributionpolicy/answer/7400114?hl=en' 'specific number|specific content|staff|employee|selectively|incentiv|discourage|bulk'
          get 'https://support.google.com/business/answer/3474122?hl=en' 'primary category|hours|virtual office|departments|service-area|signage'
          get 'https://support.google.com/business/answer/3474050?hl=en' 'review|incentiv|selectively'
          get 'https://developers.google.com/search/docs/essentials/spam-policies' 'Buying or selling links|link spam|sponsored'
