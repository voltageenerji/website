name: gecici-canli
on:
  push:
    branches: [claude/voltan-orchestrator-agent-a30dgt]
    paths: [.github/workflows/gecici-canli.yml]
permissions: {}
jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://f847c9d2.website-dh5.pages.dev
          for p in onizleme-yeni-tasarim/ onizleme-yeni-tasarim/img/kapak-800.webp onizleme-yeni-tasarim/img/kapak-1200.webp onizleme-yeni-tasarim/img/kapak-1600.webp onizleme-yeni-tasarim/img/kapak-2172.webp onizleme-yeni-tasarim/img/kapak-mobil-579.webp voltage-enerji-logo.svg; do
            echo "$p $(curl -sS -o /dev/null -w '%{http_code} %{content_type} %{size_download}' "$B/$p")"
          done
          curl -sS -D h.txt -o p.html "$B/onizleme-yeni-tasarim/"
          echo "robots_header=$(grep -ci '^x-robots-tag: *noindex' h.txt || true) robots_meta=$(grep -c 'noindex, nofollow' p.html || true) h1=$(grep -c 'id="kapakBaslik"' p.html || true) aktarici=$(grep -c "PTF_PROXY = '/onizleme-ptf'" p.html || true)"
          curl -sS -o t.json -w 'today_status=%{http_code}\n' "$B/onizleme-ptf/ptf/today"
          python3 -c "import json;d=json.load(open('t.json'));it=d.get('items') or [];print('today_items=%d sayisal=%d tarih_var=%s' % (len(it), sum(1 for x in it if isinstance(x.get('price'),(int,float))), bool(d.get('date'))))" || echo "today_json=okunamadi"
          curl -sS -o s.json -w 'stats_status=%{http_code}\n' "$B/onizleme-ptf/ptf/stats"
          python3 -c "import json;d=json.load(open('s.json'));print('stats_alan_sayisi=%d' % len(d))" || echo "stats_json=okunamadi"
          echo "baska_yol=$(curl -sS -o /dev/null -w '%{http_code}' "$B/onizleme-ptf/baska")"
