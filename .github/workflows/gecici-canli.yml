name: gecici-canli
on:
  push:
    branches: [claude/voltan-orchestrator-agent-a30dgt]
    paths: [.github/workflows/gecici-canli.yml]
permissions: {}
jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YENI: https://8c04fbf6.website-dh5.pages.dev/onizleme-yeni-tasarim/
    steps:
      - name: Basliklar
        run: |
          curl -sS -D h.txt -o p.html "$YENI"
          echo "ONIZLEME durum=$(grep -i '^HTTP' h.txt | tail -1 | tr -d '\r') xrobots=$(grep -i '^x-robots-tag' h.txt | tr -d '\r' | head -1) meta_noindex=$(grep -c 'noindex, nofollow' p.html || true)"
      - name: Tarayici denetimi (serit)
        run: |
          mkdir t && cd t && npm init -y >/dev/null && npm i playwright-core >/dev/null 2>&1
          cat > k.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const b = await chromium.launch({ channel: 'chrome' });
          for (const [ad, w, h, mob] of [['masaustu', 1440, 900, false], ['mobil', 390, 844, true]]) {
            const ctx = await b.newContext({ viewport: { width: w, height: h }, isMobile: mob, hasTouch: mob, locale: 'tr-TR', timezoneId: 'Europe/Istanbul' });
            const p = await ctx.newPage(); const hata = [];
            p.on('pageerror', e => hata.push(String(e).slice(0, 160)));
            await p.goto(process.env.YENI, { waitUntil: 'networkidle' });
            await p.waitForTimeout(1500);
            const r = await p.evaluate(() => {
              const kart = document.getElementById('ptfKart'); const ray = document.getElementById('mcpRail'); const rr = ray.getBoundingClientRect();
              const c = [...ray.querySelectorAll('.cell')];
              return { durum: kart.dataset.state, seritGizli: ray.hidden, seritGorunum: getComputedStyle(ray).display, seritHucre: c.length, seritSayisal: c.filter(x => /^\d\d:00 \d{1,3}(\.\d{3})* ₺\/MWh/.test(x.textContent)).length,
                seritYer: [Math.round(rr.top), Math.round(rr.bottom)], kapakAlt: Math.round(document.getElementById('kapak').getBoundingClientRect().bottom), kartAlt: Math.round(kart.getBoundingClientRect().bottom),
                genislik: document.documentElement.scrollWidth, yukseklik: document.documentElement.scrollHeight };
            });
            console.log('TARAYICI', ad, JSON.stringify(r), 'sayfaHatasi=' + hata.length);
            await ctx.close();
          }
          await b.close();
          JS
          node k.mjs
      - name: Lighthouse mobil
        run: |
          npm i -g lighthouse >/dev/null 2>&1
          cat > lh.mjs <<'JS'
          import { readFileSync } from 'fs';
          const rs = [1, 2, 3, 4, 5].map(i => { try { return JSON.parse(readFileSync(`m-${i}.json`, 'utf8')); } catch { return null; } }).filter(Boolean);
          console.log('LH mobil', 'kosu=' + rs.length, 'perf=' + rs.map(r => Math.round(r.categories.performance.score * 100)).join('/'), 'LCP=' + rs.map(r => Math.round(r.audits['largest-contentful-paint'].numericValue)).join('/'), 'CLS=' + rs.map(r => r.audits['cumulative-layout-shift'].numericValue.toFixed(3)).join('/'));
          JS
          for i in 1 2 3 4 5; do lighthouse "$YENI" --quiet --chrome-flags="--headless=new --no-sandbox" --output=json --output-path="m-$i.json" >/dev/null 2>&1 || true; done
          node lh.mjs
