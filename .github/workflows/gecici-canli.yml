name: gecici-canli
on:
  push:
    branches: [claude/voltan-orchestrator-agent-a30dgt]
    paths: [.github/workflows/gecici-canli.yml]
permissions: {}
jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3 4 5 6 7 8; do
            c=$(curl -sS -o a.html -w "%{http_code}" "https://voltage.com.tr/?t=$RANDOM")
            [ "$c" = "200" ] && grep -q 'Tüketicide; istenirse sabitlenir' a.html && break
            sleep 30
          done
          echo "ana=$c yeni_hucre=$(grep -c 'Tüketicide; istenirse sabitlenir' a.html || true) eski_hucre=$(grep -c 'Paylaşımlı; formül sözleşmede' a.html || true) baglanti=$(grep -c 'href="/sanayi-elektrik-tedariki"' a.html || true)"
