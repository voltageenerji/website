name: gecici-canli
on:
  push:
    branches: [claude/voltan-orchestrator-agent-a30dgt]
    paths: [.github/workflows/gecici-canli.yml]
permissions: {}
jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3 4 5 6 7 8; do
            curl -sS -o j.js "https://voltage.com.tr/g404/game.js?t=$RANDOM"
            grep -q 'Oyunu başlat' j.js && break
            sleep 30
          done
          echo "oyun_js=$(wc -c < j.js) baslat=$(grep -c 'Oyunu başlat' j.js || true) takma=$(grep -c 'Takma ad' j.js || true) tani=$(grep -c 'tani' j.js || true)"
          echo "sayfa=$(curl -sS -o p.html -w '%{http_code}' https://voltage.com.tr/olmayan-sayfa) noindex=$(grep -c noindex p.html || true)"
