name: gecici-canli
on:
  push:
    branches: [claude/voltan-orchestrator-agent-a30dgt]
    paths: [.github/workflows/gecici-canli.yml]
permissions: {}
jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3 4 5 6 7 8; do
            c=$(curl -sS -o a.html -w "%{http_code}" "https://voltage.com.tr/rehber/elektrik-tedarikcisi-nasil-secilir?t=$RANDOM")
            [ "$c" = "200" ] && grep -q 'Kimin yazdığını bilin' a.html && break
            sleep 30
          done
          echo "rehber=$c aciklama=$(grep -c 'Kimin yazdığını bilin' a.html || true) muzakere=$(grep -c 'müzakere' a.html || true) iflas_baslik=$(grep -c 'iflas ederse' a.html || true)"
          c=$(curl -sS -o s.html -w "%{http_code}" "https://voltage.com.tr/sanayi-elektrik-tedariki?t=$RANDOM")
          echo "sanayi=$c h1=$(grep -c '<h1' s.html || true) osb_sss=$(grep -c 'OSB içindeki fabrika' s.html || true) yekdem_soru=$(grep -c 'YEKDEM maliyeti' s.html || true)"
          echo "sanayi_html=$(curl -sS -o /dev/null -w '%{http_code}' https://voltage.com.tr/sanayi-elektrik-tedariki.html)"
          for u in kurumsal rehber sitemap.xml llms.txt rehber/osb-elektrik-tedariki; do
            echo "$u=$(curl -sS -o o.txt -w '%{http_code}' "https://voltage.com.tr/$u?t=$RANDOM") sanayi_link=$(grep -c 'sanayi-elektrik-tedariki' o.txt || true) rehber_link=$(grep -c 'elektrik-tedarikcisi-nasil-secilir' o.txt || true) kesilmez=$(grep -c 'elektrik kesilmez\|kesinti yaşanmaz' o.txt || true)"
          done
