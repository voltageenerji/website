name: gecici-canli
on:
  push:
    branches: [claude/voltan-orchestrator-agent-a30dgt]
    paths: [.github/workflows/gecici-canli.yml]
permissions: {}
jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Canli ana sayfa
        run: |
          curl -sS -D h.txt -o p.html "https://voltage.com.tr/?t=$(date +%s)"
          echo "CANLI durum=$(head -1 h.txt | tr -d '\r') yeni_satir=$(grep -c 'diff === null' p.html || true) eski_satir=$(grep -c 'items\[items.length - 1\].p' p.html || true) xrobots=$(grep -ci '^x-robots-tag' h.txt || true) bayt=$(wc -c < p.html)"
