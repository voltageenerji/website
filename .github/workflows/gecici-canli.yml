name: gecici-canli
on:
  push:
    branches: [claude/voltan-orchestrator-agent-a30dgt]
    paths: [.github/workflows/gecici-canli.yml]
permissions: {}
jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3 4 5 6; do
            curl -sS -o p.html -w "http=%{http_code}\n" "https://voltage.com.tr/?t=$RANDOM"
            n=$(grep -c 'contact-detail { grid-template-columns: 1fr; gap: 6px; }' p.html || true)
            echo "mobil_css=$n"
            [ "$n" = "1" ] && break
            sleep 30
          done
