name: gecici-canli
on:
  push:
    branches: [claude/voltan-orchestrator-agent-a30dgt]
    paths: [.github/workflows/gecici-canli.yml]
permissions: {}
jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      YENI: https://8eeeeabf.website-dh5.pages.dev/onizleme-yeni-tasarim/
      ONCEKI: https://c9f4b390.website-dh5.pages.dev/onizleme-yeni-tasarim/
    steps:
      - name: Lighthouse
        run: |
          npm i -g lighthouse >/dev/null 2>&1
          cat > lh.mjs <<'JS'
          import { readFileSync } from 'fs';
          const [ad, mod] = process.argv.slice(2);
          const med = a => a.sort((x, y) => x - y)[Math.floor(a.length / 2)];
          const rs = [1, 2, 3, 4, 5].map(i => { try { return JSON.parse(readFileSync(`${ad}-${mod}-${i}.json`, 'utf8')); } catch { return null; } }).filter(Boolean);
          if (!rs.length) { console.log('LH', ad, mod, 'olcum yok'); process.exit(0); }
          const c = k => Math.round(med(rs.map(r => (r.categories[k] || {}).score || 0)) * 100);
          const a = k => med(rs.map(r => (r.audits[k] || {}).numericValue || 0));
          console.log('LH', ad, mod, 'LCPler=' + rs.map(r => Math.round(r.audits['largest-contentful-paint'].numericValue)).join('/'), 'perf=' + rs.map(r => Math.round(r.categories.performance.score*100)).join('/'), `kosu=${rs.length} perf=${c('performance')} erisilebilirlik=${c('accessibility')} LCP=${Math.round(a('largest-contentful-paint'))}ms CLS=${a('cumulative-layout-shift').toFixed(3)} TBT=${Math.round(a('total-blocking-time'))}ms bayt=${Math.round(a('total-byte-weight'))}`);
          JS
          for i in 1 2 3 4 5; do
            for ad in YENI ONCEKI; do
              lighthouse "$(printenv $ad)" --quiet --chrome-flags="--headless=new --no-sandbox" --output=json --output-path="$ad-mobil-$i.json" >/dev/null 2>&1 || true
            done
          done
          node lh.mjs ONCEKI mobil; node lh.mjs YENI mobil
