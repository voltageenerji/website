name: gecici-canli
on:
  push:
    branches: [claude/voltan-orchestrator-agent-a30dgt]
    paths: [.github/workflows/gecici-canli.yml]
permissions: {}
jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "" kurumsal rehber/skdm-elektrik-sertifika; do
            echo "/$u http=$(curl -sS -o o.html -w '%{http_code}' "https://voltage.com.tr/$u?t=$RANDOM") logo_img=$(grep -c 'alt="Voltage Enerji logosu"' o.html || true) sayac=$(grep -o "data-cf-beacon='[^']*'" o.html | grep -vc BURAYA || true)"
          done
