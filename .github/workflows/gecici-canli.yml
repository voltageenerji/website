name: gecici-canli
on:
  push:
    branches: [claude/voltan-orchestrator-agent-a30dgt]
    paths: [.github/workflows/gecici-canli.yml]
permissions: {}
jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3 4 5 6 7 8; do
            c=$(curl -sS -o a.html -w "%{http_code}" "https://voltage.com.tr/?t=$RANDOM")
            [ "$c" = "200" ] && grep -q 'kaynakBul' a.html && break
            sleep 30
          done
          echo "ana=$c kaynak_js=$(grep -c 'kaynakBul' a.html || true) eski_iletisim_link=0"
          for u in rehber/sktt rehber/tedarikci-degistirme sanayi-elektrik-tedariki elektrik-faturasi-hesaplama kurumsal canli-ptf kullanim-kosullari kvkk llms.txt; do
            curl -sS -o o.txt "https://voltage.com.tr/$u?t=$RANDOM"
            echo "$u eski=$(grep -c 'href="/#iletisim"' o.txt || true) yeni=$(grep -c 'kaynak=' o.txt || true) org=$(grep -c '#organization' o.txt || true) fsek=$(grep -c 'FSEK' o.txt || true) dengeleme=$(grep -c 'dengeleme piyasasında' o.txt || true)"
          done
          echo "og=$(curl -sS -o /dev/null -w '%{http_code} %{size_download}' https://voltage.com.tr/og/rehber.jpg)"
