# GEÇİCİ — e-posta DNS kayıtlarının (SPF, DMARC, DKIM) doğrulaması. Secret kullanmaz;
# yalnızca herkese açık DNS yanıtlarını yazdırır. İş bitince silinecek.
name: DNS Check

on:
  push:
    branches: [claude/voltan-orchestrator-agent-a30dgt]
    paths: ['.github/workflows/dns-check.yml']

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Kayitlar
        run: |
          for d in voltage.com.tr voltan.com.tr voltan.com; do
            echo "=================== $d"
            for ns in 1.1.1.1 8.8.8.8; do
              echo "SPF   @$ns: $(dig +short TXT $d @$ns | grep -i 'v=spf1' | tr '\n' ' ')  [adet: $(dig +short TXT $d @$ns | grep -ci 'v=spf1')]"
              r=$(dig +short TXT google._domainkey.$d @$ns | tr -d '"\n ')
              echo "DKIM  @$ns: ${r:0:28}… uzunluk ${#r}, p= sonrası $(echo "$r" | sed -n 's/.*p=//p' | wc -c) karakter"
            done
            echo "DMARC: $(dig +short TXT _dmarc.$d @1.1.1.1 | tr '\n' ' ')"
            echo "MX:    $(dig +short MX $d @1.1.1.1 | sort -n | tr '\n' ' ')"
          done
          echo "=================== Resend (voltage.com.tr)"
          echo "send MX:  $(dig +short MX send.voltage.com.tr @1.1.1.1 | tr '\n' ' ')"
          echo "send SPF: $(dig +short TXT send.voltage.com.tr @1.1.1.1 | tr '\n' ' ')"
          r=$(dig +short TXT resend._domainkey.voltage.com.tr @1.1.1.1 | tr -d '"\n ')
          echo "resend DKIM: ${r:0:20}… uzunluk ${#r}"
