# GEÇİCİ — yayın doğrulaması. Secret yok; yalnızca durum kodu ve herkese açık başlık metni. İş bitince silinecek.
name: Live Check
on:
  push:
    branches: [claude/voltan-orchestrator-agent-a30dgt]
    paths: ['.github/workflows/live-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in / /kurumsal /rehber/sktt; do
            curl -sS -m 25 -A 'Mozilla/5.0' -o p.html -w "$p HTTP %{http_code}\n" "https://voltage.com.tr$p"
            grep -o '<title>[^<]*' p.html; grep -o 'name="description" content="[^"]*' p.html | cut -c1-200
          done
