# GEÇİCİ — GD-SEO-03 yayın doğrulaması. Secret kullanmaz; yalnızca durum kodu ve eşleşme sayısı yazdırır.
# İş bitince silinecek.
name: Live Check

on:
  push:
    branches: [claude/voltan-orchestrator-agent-a30dgt]
    paths: ['.github/workflows/live-check.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Canli sayfalar
        run: |
          chk() { # url, beklenen metin (var), beklenmeyen metin (yok)
            curl -sS -m 25 -A 'Mozilla/5.0' -o p.html -w '%{http_code}' "$1" > code.txt || echo 000 > code.txt
            echo "$1 HTTP $(cat code.txt) | yeni metin: $(grep -c -F "$2" p.html) | eski metin: $(grep -c -F "$3" p.html)"
          }
          chk https://voltage.com.tr/rehber/ptf-nedir "SMF nedir, PTF'den farkı ne?" "PTF ile SMF arasındaki fark nedir?"
          chk https://voltage.com.tr/rehber/tedarikci-degistirme "tedarikçi değiştirmek için elektriğin kesilmesi gerekmez" "kesintisiz olarak birbirini izler"
          chk https://voltage.com.tr/rehber/serbest-tuketici "işletme ya da mesken ayrımı olmaksızın" "katbekat"
          chk https://voltage.com.tr/sitemap.xml "<lastmod>2026-11-07</lastmod>" "zzz-yok"
          chk https://voltage.com.tr/kurumsal "Kurumsal Kimlik" "zzz-yok"
          chk https://voltage.com.tr/ "Voltage Enerji" "zzz-yok"
          for p in /docs/OPERASYON-DEFTERI.md /tools/gsc-export.mjs /.claude/settings.json /.github/workflows/live-check.yml; do
            echo "$p -> $(curl -sS -m 20 -o /dev/null -w '%{http_code}' "https://voltage.com.tr$p")"
          done
