# GEÇİCİ — yeni tasarım yayın sonrası denetimi (27.11). Yalnız durum kodları, başlık değerleri, sayılar ve özetler
# yazdırılır; yanıt gövdesi yazdırılmaz (CLAUDE.md kural 6). Bir sonraki commit'te silinir.
name: gecici-yayin-sonrasi
on:
  push:
    branches: [claude/voltan-orchestrator-agent-a30dgt]
    paths: ['.github/workflows/gecici-yayin-sonrasi.yml']
permissions: {}
jobs:
  denetle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Yayin sonrasi denetim
        shell: bash {0}
        run: |
          set +e
          K=https://voltage.com.tr
          R=https://raw.githubusercontent.com/voltageenerji/website/main
          # Canli dosya ile main'deki dosya farki (herkese acik sayfalar; yalniz fark satirlari, 160 karakter)
          for p in "/|index.html" "/rehber/ptf-nedir|rehber/ptf-nedir.html" "/rehber/serbest-tuketici|rehber/serbest-tuketici.html" "/rehber/tedarikci-degistirme|rehber/tedarikci-degistirme.html" "/rehber/tekstil-elektrik|rehber/tekstil-elektrik.html"; do
            u=${p%%|*}; f=${p##*|}
            curl -s --max-time 20 "$K$u" > /tmp/canli; curl -s --max-time 20 "$R/$f" > /tmp/depo
            echo "== $u canli=$(wc -c </tmp/canli) depo=$(wc -c </tmp/depo) fark-satiri=$(diff /tmp/depo /tmp/canli | grep -c '^[<>]')"
            diff /tmp/depo /tmp/canli | head -12 | cut -c1-160
          done
          for p in / /rehber/sktt /kurumsal; do
            echo "$p son durum: $(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$K$p")"
          done
