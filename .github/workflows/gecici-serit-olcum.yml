name: gecici-serit-olcum
# GEÇİCİ: önizleme ana sayfasındaki saatlik PTF şeridinin hareketini ölçer. Yalnız sayılar, durumlar ve betik hata
# iletilerinin ilk 140 karakteri yazdırılır (sayfa gövdesi, veri değeri yazdırılmaz). Bir sonraki commit'te silinir.
on:
  push:
    branches: [claude/voltan-orchestrator-agent-a30dgt]
    paths: [.github/workflows/gecici-serit-olcum.yml]
permissions: {}
jobs:
  olcum:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Playwright kur
        shell: bash {0}
        run: |
          mkdir o && cd o && npm init -y >/dev/null; npm i playwright@latest 2>&1 | tail -1; npx playwright install --with-deps chromium webkit 2>&1 | tail -1
      - name: Şerit — üstüne gelme, telefon öykünmesi, WebKit hata iletisi (yalnız sayılar)
        shell: bash {0}
        working-directory: o
        run: |
          cat > o.mjs <<'JS'
          import pw from 'playwright';
          const hedefler = [['onizleme', 'https://6da52819.website-dh5.pages.dev/'], ['canli', 'https://voltage.com.tr/']];
          const X = (p) => p.evaluate(() => { const t = document.getElementById('mcpTrack'); return t ? t.getBoundingClientRect().left : null; });
          for (const tarayici of ['webkit']) {
            const b = await pw[tarayici].launch();
            for (const [ad, url] of hedefler) {
              // 1) masaüstü: imleç şeridin üstündeyken hareket
              { const c = await b.newContext({ viewport: { width: 1440, height: 900 } }); const p = await c.newPage(); const hata = []; p.on('pageerror', e => hata.push(String(e.message).slice(0, 140)));
                await p.goto(url, { waitUntil: 'load', timeout: 45000 }); await p.waitForTimeout(4000);
                const a0 = await X(p); await p.waitForTimeout(2000); const a1 = await X(p);
                await p.hover('#mcpRail'); const h0 = await X(p); await p.waitForTimeout(2000); const h1 = await X(p);
                console.log(tarayici, ad, '1440 serbest_2sn_px=' + (a0 - a1).toFixed(1), 'imlec_ustunde_2sn_px=' + (h0 - h1).toFixed(1), 'hatalar=' + JSON.stringify(hata));
                await c.close(); }
              // 2) telefon öykünmesi (dokunmatik), şeride dokunmadan ve sayfayı kaydırıp geri gelince
              { const d = tarayici === 'webkit' ? pw.devices['iPhone 13'] : pw.devices['Pixel 7']; const c = await b.newContext({ ...d }); const p = await c.newPage(); const hata = []; p.on('pageerror', e => hata.push(String(e.message).slice(0, 140)));
                await p.goto(url, { waitUntil: 'load', timeout: 45000 }); await p.waitForTimeout(4000);
                const a0 = await X(p); await p.waitForTimeout(2000); const a1 = await X(p);
                await p.evaluate(() => scrollTo(0, 1500)); await p.waitForTimeout(600); await p.evaluate(() => scrollTo(0, 0)); await p.waitForTimeout(600);
                const k0 = await X(p); await p.waitForTimeout(2000); const k1 = await X(p);
                const rm = await p.evaluate(() => matchMedia('(prefers-reduced-motion: reduce)').matches);
                console.log(tarayici, ad, 'telefon', 'rm=' + rm, 'serbest_2sn_px=' + (a0 - a1).toFixed(1), 'kaydirma_sonrasi_2sn_px=' + (k0 - k1).toFixed(1), 'hatalar=' + JSON.stringify(hata));
                await c.close(); }
            }
            await b.close();
          }
          JS
          node o.mjs
