# Lead raporu zamanlayıcısı — voltage.com.tr/api/report tetikleyicisi.
#
# Cron'lar (hepsi UTC; İstanbul = UTC+3, DST yok):
#   '30 5 * * 1'        → Pazartesi 08:30 İst   → HAFTALIK  (son 7 tam gün)
#   '45 5 1 * *'        → ayın 1'i 08:45 İst    → AYLIK     (önceki takvim ayı)
#   '0 6 1 1,4,7,10 *'  → Oca/Nis/Tem/Eki 1'i 09:00 İst → 3 AYLIK (önceki çeyrek)
#   '15 6 1 1,7 *'      → Oca/Tem 1'i 09:15 İst → 6 AYLIK  (önceki yarıyıl)
#   '30 6 1 1 *'        → 1 Ocak 09:30 İst      → YILLIK    (önceki takvim yılı)
#
# 1 Ocak'ta dört rapor birden gider (aylık + 3 aylık + 6 aylık + yıllık) ve
# bu BİLİNÇLİDİR: dönemler farklıdır, biri diğerinin yerine geçmez. Dakikalar
# kasten kaydırıldı ki aynı anda çalışıp e-posta sağlayıcısını zorlamasınlar.
#
# Dönem seçimi github.event.schedule ile ayırt edilir. Manuel test:
# Actions → "Lead Reports" → Run workflow → dönem seç.
#
# Gerekli repo secret: REPORT_TOKEN (Cloudflare Pages'teki değerle birebir aynı).
# curl -fsS: 2xx dışı yanıtta adım FAIL olur — kırık pipeline asla sessiz kalmaz.

name: Lead Reports

on:
  schedule:
    - cron: '30 5 * * 1'          # haftalık
    - cron: '45 5 1 * *'          # aylık
    - cron: '0 6 1 1,4,7,10 *'    # 3 aylık
    - cron: '15 6 1 1,7 *'        # 6 aylık
    - cron: '30 6 1 1 *'          # yıllık
  workflow_dispatch:
    inputs:
      period:
        description: 'Rapor dönemi'
        required: true
        default: 'weekly'
        type: choice
        options:
          - weekly
          - monthly
          - quarterly
          - semiannual
          - yearly

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Determine period
        id: period
        run: |
          case "${{ github.event_name }}:${{ github.event.schedule }}" in
            workflow_dispatch:*)          PERIOD="${{ inputs.period }}" ;;
            *":45 5 1 * *")               PERIOD="monthly" ;;
            *":0 6 1 1,4,7,10 *")         PERIOD="quarterly" ;;
            *":15 6 1 1,7 *")             PERIOD="semiannual" ;;
            *":30 6 1 1 *")               PERIOD="yearly" ;;
            *)                            PERIOD="weekly" ;;
          esac
          echo "period=$PERIOD" >> "$GITHUB_OUTPUT"
          echo "Seçilen dönem: $PERIOD"

      - name: Call report endpoint
        env:
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: |
          if [ -z "$REPORT_TOKEN" ]; then
            echo "::error::REPORT_TOKEN secret tanımlı değil"
            exit 1
          fi
          # -o /dev/null: yanıt GÖVDESİ ASLA günlüğe yazılmaz. Bu günlük
          # genel-okunur (repo public); gövde müşteri verisi taşıyabilir (QA B2).
          # Yalnızca HTTP durum kodu yazdırılır; 2xx dışı -f ile job'ı düşürür.
          HTTP=$(curl -fsS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $REPORT_TOKEN" \
            "https://voltage.com.tr/api/report?period=${{ steps.period.outputs.period }}")
          echo "Rapor ucu yanıtı: HTTP $HTTP"
