name: gecici-seo-regresyon
# GEÇİCİ (Teknik SEO, 27.11): yeni tasarım yayın adayı (RC) ile main arasında canlı başlık/durum kodu
# denetimi ve Lighthouse karşılaştırması (2. tur: yalnız Lighthouse 12.6.1, 7 koşu, gözlenen metrikler). Günlüğe YALNIZ durum kodu, başlık değeri, bayt sayısı,
# özet (hash) ve metrik yazılır; sayfa gövdesi, Search Console verisi yazılmaz. Bir sonraki commit'te silinir.
on:
  push:
    branches: [claude/voltan-orchestrator-agent-a30dgt]
    paths: [.github/workflows/gecici-seo-regresyon.yml]
permissions: {}
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        sayfa: ['/', '/rehber/tekstil-elektrik', '/rehber', '/canli-ptf', '/elektrik-faturasi-hesaplama', '/kurumsal']
        form: [mobile, desktop]
    steps:
      - name: Lighthouse kur
        shell: bash {0}
        run: |
          mkdir l && cd l && npm init -y >/dev/null && npm i lighthouse@12.6.1 >/dev/null 2>&1; echo "kurulum=$?"; google-chrome --version
      - name: Lighthouse 5 kosu x 2 host (sirali, dönüşümlü)
        shell: bash {0}
        working-directory: l
        env:
          SAYFA: ${{ matrix.sayfa }}
          FORM: ${{ matrix.form }}
        run: |
          export CHROME_PATH=$(which google-chrome)
          cat > p.mjs <<'JS'
          import fs from 'fs';
          const [f, etiket] = process.argv.slice(2);
          const r = JSON.parse(fs.readFileSync(f, 'utf8')); const a = r.audits;
          const n = (k) => a[k] && a[k].numericValue != null ? a[k].numericValue : NaN;
          let lcpSel = '-';
          try { const d = a['largest-contentful-paint-element'].details; const it = d.items[0].items ? d.items[0].items[0] : d.items[0]; lcpSel = (it.node.selector || '').slice(-60) + ' <' + (it.node.snippet || '').slice(1, 10); } catch (e) {}
          const req = (a['network-requests'] && a['network-requests'].details.items) || [];
          const tip = {}; for (const q of req) { const t = q.resourceType || 'x'; tip[t] = tip[t] || [0, 0]; tip[t][0]++; tip[t][1] += q.transferSize || 0; }
          const rb = a['render-blocking-resources'] && a['render-blocking-resources'].details ? a['render-blocking-resources'].details.items.length : 0;
          const rbms = a['render-blocking-resources'] ? Math.round(a['render-blocking-resources'].numericValue || 0) : 0;
          const mt = a.metrics.details.items[0];
          let kay = []; try { kay = a['layout-shifts'].details.items.slice(0, 2).map(it => it.score.toFixed(3) + '@' + ((it.node && it.node.selector) || '?').slice(-45) + '(' + ((it.subItems && it.subItems.items[0] && it.subItems.items[0].cause) || '-') + ')'); } catch (e) {}
          const o = { etiket, ofcp: Math.round(mt.observedFirstContentfulPaint), olcp: Math.round(mt.observedLargestContentfulPaint), ttfb: Math.round(n('server-response-time')), kay: kay.join(' '), skor: Math.round(r.categories.performance.score * 100), lcp: Math.round(n('largest-contentful-paint')), fcp: Math.round(n('first-contentful-paint')), si: Math.round(n('speed-index')), tbt: Math.round(n('total-blocking-time')), cls: +n('cumulative-layout-shift').toFixed(4), bayt: Math.round(n('total-byte-weight')), istek: req.length, rb, rbms, lcpSel, tip: Object.entries(tip).map(([k, v]) => k + ':' + v[0] + '/' + v[1]).join(','), hata: r.runtimeError ? r.runtimeError.code : '' };
          console.log('SONUC ' + JSON.stringify(o));
          JS
          cat > m.mjs <<'JS'
          import fs from 'fs';
          const s = fs.readFileSync(0, 'utf8').split('\n').filter(l => l.startsWith('SONUC ')).map(l => JSON.parse(l.slice(6)));
          const med = (v) => { v = v.filter(x => !Number.isNaN(x)).sort((a, b) => a - b); const m = v.length >> 1; return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2; };
          for (const h of ['main', 'rc']) { const x = s.filter(o => o.etiket.startsWith(h + ' ')); if (!x.length) continue;
            const o = {}; for (const k of ['skor', 'lcp', 'fcp', 'si', 'tbt', 'cls', 'ofcp', 'olcp', 'ttfb', 'bayt', 'istek']) o[k] = med(x.map(y => y[k]));
            o.lcp_aralik = Math.min(...x.map(y => y.lcp)) + '-' + Math.max(...x.map(y => y.lcp)); o.n = x.length;
            console.log('MEDYAN ' + process.env.FORM + ' ' + process.env.SAYFA + ' ' + h + ' ' + JSON.stringify(o)); }
          JS
          for h in https://website-dh5.pages.dev https://9c79718b.website-dh5.pages.dev; do curl -s -o /dev/null "$h$SAYFA"; curl -s -o /dev/null "$h$SAYFA"; done
          PRE=""; [ "$FORM" = desktop ] && PRE="--preset=desktop"
          : > tum.txt
          for i in 1 2 3 4 5 6 7; do
            for pair in "main https://website-dh5.pages.dev" "rc https://9c79718b.website-dh5.pages.dev"; do
              set -- $pair
              npx lighthouse "$2$SAYFA" $PRE --only-categories=performance --output=json --output-path=r.json --quiet --chrome-flags="--headless=new --no-sandbox" >/dev/null 2>&1
              node p.mjs r.json "$1 $i" | tee -a tum.txt
            done
          done
          node m.mjs < tum.txt
