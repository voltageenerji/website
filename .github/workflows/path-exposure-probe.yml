# GEÇİCİ — iç dosyalar canlı sitede açık mı? Yalnızca HTTP durum kodu yazdırır.
# Secret kullanmaz, gövde yazdırmaz. Ölçüm bitince silinecek.
name: Path Exposure Probe

on:
  push:
    branches: [claude/voltan-orchestrator-agent-a30dgt]
    paths: ['.github/workflows/path-exposure-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Durum kodlari (yonlendirme takip edilmez)
        run: |
          for p in /.claude/agents/ORG-CHART.md /.claude/agents/design.md /.claude/settings.json /.claude/rules/homepage.md \
                   /.github/workflows/lead-reports.yml /CLAUDE.md /DEPLOY.md /docs/OPERASYON-DEFTERI.md /tools/gsc-export.mjs \
                   / /rehber/sktt /canli-ptf /kurumsal /sitemap.xml /robots.txt; do
            printf '%-42s %s\n' "$p" "$(curl -s -o /dev/null -m 20 -w '%{http_code} %{redirect_url}' "https://voltage.com.tr$p")"
          done
