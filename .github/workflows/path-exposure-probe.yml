# GEÇİCİ — yayın sonrası doğrulama: iç dosyalar kapandı mı, sayfalar açık mı?
# Yalnızca HTTP durum kodu ve sayım yazdırır. Ölçüm bitince silinecek.
name: Path Exposure Probe

on:
  push:
    branches: [claude/voltan-orchestrator-agent-a30dgt]
    paths: ['.github/workflows/path-exposure-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Yayinin tamamlanmasini bekle
        run: sleep 150
      - name: Durum kodlari (yonlendirme takip edilmez)
        run: |
          for p in /.claude/agents/ORG-CHART.md /.claude/agents/design.md /.claude/settings.json /.claude/hooks/guard.py /.claude/rules/homepage.md \
                   /.github/workflows/lead-reports.yml /README.md /.gitignore /CLAUDE.md /docs/OPERASYON-DEFTERI.md /tools/gsc-export.mjs /game404/ \
                   / /rehber /rehber/sktt /canli-ptf /kurumsal /kvkk /elektrik-faturasi-hesaplama /sitemap.xml /robots.txt /llms.txt; do
            printf '%-40s %s\n' "$p" "$(curl -s -o /dev/null -m 20 -w '%{http_code} %{redirect_url}' "https://voltage.com.tr$p")"
          done
          echo "kvkk sayfasinda eski numara sayisi: $(curl -s -m 20 https://voltage.com.tr/kvkk | grep -c -E '479[ .-]?0?5[ .-]?10')"
          echo "kvkk sayfasinda 34660 sayisi: $(curl -s -m 20 https://voltage.com.tr/kvkk | grep -c '34660')"
