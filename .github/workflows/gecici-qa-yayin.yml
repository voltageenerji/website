          cat > ios-yedek.mjs <<'QAEOF'
          #!/usr/bin/env node
          // iOS Simülatörü yedek yolu (safaridriver simülatöre bağlanamazsa): önizleme adresini 127.0.0.1:8790'dan aktaran küçük
          // sunucu. HTML'e ölçüm modülü ve kendiliğinden çalışan senaryo eklenir; sonuç /__qa/rapor'a yazılır. EPİAŞ proxy çağrısı
          // /__ptf üzerinden önizleme kökeniyle aktarılır. Günlüğe sayfa içeriği yazılmaz.
          //   TABAN=<önizleme> node ios-yedek.mjs      ·  GET /__qa/raporlar → JSON (yalnız sayılar)
          import http from 'node:http';
          import { readFileSync } from 'node:fs';
          const TABAN = process.env.TABAN.replace(/\/$/, '');
          const PTF = 'https://epias-proxy.emirhantan-ku.workers.dev';
          const OLCUM = readFileSync(new URL('./olcum.js', import.meta.url), 'utf8');
          const raporlar = [];
          const SENARYO = `(function(){
            var R={yol:location.pathname,baharsiz:/qabaharsiz/.test(location.search),olay:[]};var bek=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
            function gonder(){try{navigator.sendBeacon('/__qa/rapor',JSON.stringify(R))}catch(e){}}
            window.addEventListener('error',function(){R.hata=(R.hata||0)+1});
            window.addEventListener('load',async function(){
              await bek(location.pathname==='/'?7000:2500);
              R.durum=__qa.durum();
              var m=__qa.menu(); if(m.dugmeGorunur){document.getElementById('mobileMenuBtn').click();await bek(400);R.menuAcik=__qa.menu();document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await bek(300);R.menuKapali=__qa.menu();}
              if(location.pathname==='/'){
                R.ana=__qa.ana(); R.serit=await new Promise(function(r){__qa.serit(2000,r)});
                var k=document.getElementById('lead-yesil'); k.scrollIntoView({block:'center',behavior:'instant'});
                ['lead-ad','lead-sirket'].forEach(function(id){var e=document.getElementById(id);e.focus();e.value='Deneme';e.dispatchEvent(new Event('input',{bubbles:true}))});
                await bek(300); R.kontrol=__qa.baharBasla(7000); var t0=performance.now(); k.click(); var tk=performance.now(); while(!document.querySelector('.bh-kat') && performance.now()-tk<500) await new Promise(function(r){requestAnimationFrame(r)}); R.isaret=[k.checked,document.querySelectorAll('.bh-kat').length,Math.round(performance.now()-tk)];
                var ta=document.getElementById('lead-mesaj'); ta.focus(); var s='Bahar sirasinda yazi', gec=[];
                for(var i=0;i<s.length;i++){var a=performance.now();ta.value+=s[i];ta.dispatchEvent(new Event('input',{bubbles:true}));await bek(60);gec.push(performance.now()-a-60)}
                R.yazi=[ta.value.length,Math.round(Math.max.apply(null,gec)),document.activeElement===ta];
                await bek(Math.max(0,7400-(performance.now()-t0))); R.bahar=__qa.baharSonuc();
              }
              if(location.pathname==='/elektrik-faturasi-hesaplama'){var t=document.getElementById('t1Tutar'),w=document.getElementById('t1Kwh');t.value='2.450,80';t.dispatchEvent(new Event('input',{bubbles:true}));w.value='520';w.dispatchEvent(new Event('input',{bubbles:true}));await bek(800);R.hesap=__qa.hesap();}
              if(location.pathname==='/canli-ptf'){var h=[].slice.call(document.querySelectorAll('#pTable td')).map(function(x){return x.textContent.trim()});R.tablo={hucre:h.length,tire:h.filter(function(v){return v==='\\u2014'}).length,sifir:h.filter(function(v){return /^0+([.,]0+)?$/.test(v)}).length};}
              R.bitti=true; gonder();
            });
          })();`;
          const YAKALA = `<script>window.__qaHata=[];addEventListener('error',function(){window.__qaHata.push(1)});</script>`;
          const EK = (oto) => YAKALA + `<script>${OLCUM}\n${oto ? SENARYO : ''}</script>`;

          http.createServer(async (q, s) => {
            try {
              if (q.url === '/__qa/rapor' && q.method === 'POST') { let b = ''; q.on('data', c => b += c); q.on('end', () => { try { raporlar.push(JSON.parse(b)); } catch { } s.end('ok'); }); return; }
              if (q.url === '/__qa/raporlar') { s.setHeader('content-type', 'application/json'); return s.end(JSON.stringify(raporlar)); }
              const hedef = q.url.startsWith('/__ptf/') ? PTF + q.url.slice(6) : TABAN + q.url;
              const r = await fetch(hedef, { headers: { 'user-agent': q.headers['user-agent'] || 'qa', origin: new URL(TABAN).origin, accept: q.headers.accept || '*/*' }, redirect: 'manual' });
              const tur = r.headers.get('content-type') || '';
              const bas = { 'content-type': tur, 'cache-control': 'no-store' }; const yer = r.headers.get('location'); if (yer) bas.location = yer.replace(TABAN, '');
              if (tur.includes('text/html')) {
                let h = await r.text();
                const oto = /[?&]qaoto/.test(q.url);
                if (/[?&]qabaharsiz/.test(q.url)) { const i = h.indexOf('// 9) Bahar an'); const son = "form.addEventListener('submit', function(){ sondur(true); });"; const j = h.indexOf(son, i); if (i > 0 && j > i) h = h.slice(0, i) + h.slice(h.indexOf('})();', j) + 5); }
                h = h.split(PTF).join('/__ptf').replace(/<head>/i, '<head>' + EK(oto));
                s.writeHead(r.status, bas); return s.end(h);
              }
              s.writeHead(r.status, bas); s.end(Buffer.from(await r.arrayBuffer()));
            } catch (e) { s.writeHead(502); s.end('yedek: ' + e.name); }
          }).listen(8790, '127.0.0.1', () => console.log('yedek sunucu 8790'));
          QAEOF
          cat > ocr.swift <<'QAEOF'
          // iOS Simülatörü ekran görüntülerinin PİKSELSİZ özeti (macOS Vision OCR).
          // !!! Görüntülerdeki rakamlar UYDURMA TEST VERİSİDİR. Çıktı yalnız "beklenen ifade var mı" doğru/yanlış
          // ve tanınan satır sayısıdır; tanınan metnin kendisi basılmaz.
          //   swift docs/qa/ekran-ocr.swift <görüntü.png> "<ifade1>|<ifade2>|…" ["<olmaması gereken1>|…"]
          import Foundation
          import Vision
          import AppKit

          func katla(_ s: String) -> String {
            return s.folding(options: [.caseInsensitive, .diacriticInsensitive], locale: Locale(identifier: "tr_TR")).replacingOccurrences(of: " ", with: "")
          }
          let a = CommandLine.arguments
          guard a.count >= 3, let img = NSImage(contentsOfFile: a[1]), let cg = img.cgImage(forProposedRect: nil, context: nil, hints: nil) else {
            print("\(a.count > 1 ? (a[1] as NSString).lastPathComponent : "?"): görüntü okunamadı"); exit(1)
          }
          let istek = VNRecognizeTextRequest()
          istek.recognitionLevel = .accurate
          istek.recognitionLanguages = ["tr-TR", "en-US"]
          istek.usesLanguageCorrection = false
          try VNImageRequestHandler(cgImage: cg, options: [:]).perform([istek])
          let satirlar = (istek.results ?? []).compactMap { $0.topCandidates(1).first?.string }
          let hepsi = katla(satirlar.joined(separator: " "))
          let ad = (a[1] as NSString).lastPathComponent
          var kotu = 0
          var cikti = "\(ad): \(cg.width)x\(cg.height) px, \(satirlar.count) metin satırı"
          for i in a[2].split(separator: "|") { let v = hepsi.contains(katla(String(i))); if !v { kotu += 1 }; cikti += " · '\(i)' \(v ? "VAR" : "YOK")" }
          if a.count > 3 { for i in a[3].split(separator: "|") { let v = hepsi.contains(katla(String(i))); if v { kotu += 1 }; cikti += " · olmamalı '\(i)' \(v ? "VAR!" : "yok")" } }
          print(cikti)
          exit(kotu == 0 ? 0 : 1)
          QAEOF
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json,sys,re
          d=json.load(sys.stdin)["devices"]
          c=[(k,x) for k,v in d.items() if "iOS" in k for x in v if re.match(r"iPhone 1[5-7]$",x["name"])]
          c.sort(key=lambda t:(t[0],t[1]["name"]))
          print(c[-1][1]["udid"] if c else "")')
          xcrun simctl list devices available --json | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];[print("simülatör:",x["name"],k.split(".")[-1]) for k,v in d.items() for x in v if x["udid"]=="'"$UDID"'"]'
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" &
          npm install --no-audit --no-fund "selenium-webdriver@${SELENIUM_SURUM}" >/dev/null 2>&1; echo "npm $?"
          sudo safaridriver --enable; echo "safaridriver $?"
      - name: Aktarıcı (127.0.0.1:8790; EPİAŞ çağrısı aynı kökenden, hata yakalayıcı ilk betik)
        working-directory: ${{ runner.temp }}/qa
        run: |
          nohup node ios-yedek.mjs > ../yedek.log 2>&1 &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:8790/robots.txt && break; sleep 1; done
          curl -s -o /dev/null -w 'aktarıcı %{http_code}\n' http://127.0.0.1:8790/
      - name: Hareket azaltmayı kapat (yalnız koşucuda; Safari açılmadan önce)
        continue-on-error: true
        run: |
          echo "reduceMotion önce: $(defaults read com.apple.universalaccess reduceMotion 2>&1 | head -1)"
          defaults write com.apple.universalaccess reduceMotion -bool false 2>&1 | head -2; sudo defaults write com.apple.universalaccess reduceMotion -bool false 2>&1 | head -2
          echo "reduceMotion şimdi: $(defaults read com.apple.universalaccess reduceMotion 2>&1 | head -1)"
      - name: Gerçek Safari (macOS, safaridriver) — aktarıcı üzerinden canlı veriyle
        working-directory: ${{ runner.temp }}/qa
        continue-on-error: true
        run: TABAN=http://127.0.0.1:8790 MOD=safari MODUL=$PWD/node_modules perl -e 'alarm shift; exec @ARGV' 600 node gercek.mjs
      - name: Gerçek Safari (macOS, safaridriver) — önizleme adresine doğrudan (gerçek başlıklar, CORS → dürüst bekleme)
        working-directory: ${{ runner.temp }}/qa
        continue-on-error: true
        run: MOD=safari MODUL=$PWD/node_modules perl -e 'alarm shift; exec @ARGV' 600 node gercek.mjs
      - name: iOS Simülatörü — Mobile Safari, safaridriver ile (Uzaktan Otomasyon)
        id: iossd
        working-directory: ${{ runner.temp }}/qa
        continue-on-error: true
        shell: bash {0}
        run: |
          xcrun simctl bootstatus "$UDID" -b > /dev/null; echo "önyükleme $?"
          for k in RemoteAutomationEnabled WebKitRemoteAutomationEnabled; do xcrun simctl spawn "$UDID" defaults write com.apple.mobilesafari $k -bool true; done
          xcrun simctl spawn "$UDID" defaults write com.apple.WebInspector RemoteAutomationEnabled -bool true
          TABAN=http://127.0.0.1:8790 MOD=ios IOS_UDID=$UDID MODUL=$PWD/node_modules perl -e 'alarm shift; exec @ARGV' 240 node gercek.mjs; k=$?; echo "ios-safaridriver çıkış $k"; exit $k
      - name: iOS Simülatörü — Mobile Safari, openurl + sayfa içi senaryo + ekran OCR (her durumda)
        working-directory: ${{ runner.temp }}/qa
        shell: bash {0}
        run: |
          xcrun simctl status_bar "$UDID" override --time 14:30 2>/dev/null || true
          xcrun simctl terminate "$UDID" com.apple.mobilesafari 2>/dev/null
          B=http://127.0.0.1:8790; E=../ekran
          xcrun simctl openurl "$UDID" "$B/?qaoto"; sleep 9; xcrun simctl io "$UDID" screenshot $E/ios-1-ana-ilk.png >/dev/null 2>&1
          sleep 4.5; xcrun simctl io "$UDID" screenshot $E/ios-2-bahar.png >/dev/null 2>&1
          sleep 12; xcrun simctl io "$UDID" screenshot $E/ios-3-bahar-sonra.png >/dev/null 2>&1
          for i in 1 2 3; do xcrun simctl openurl "$UDID" "$B/?qaoto&qabaharsiz&n=$i"; sleep 20; xcrun simctl openurl "$UDID" "$B/?qaoto&n=$i"; sleep 20; done
          for p in rehber/sktt canli-ptf elektrik-faturasi-hesaplama kurumsal olmayan-sayfa-qa-yayin; do xcrun simctl openurl "$UDID" "$B/$p?qaoto"; sleep 9; xcrun simctl io "$UDID" screenshot $E/ios-$(echo $p | tr / -).png >/dev/null 2>&1; done
          sleep 3
          H="Cannot Open|Cannot Connect|açılamıyor|bağlanamıyor"
          swift ocr.swift $E/ios-1-ana-ilk.png "Voltage|Teklif" "$H"
          swift ocr.swift $E/ios-2-bahar.png "Yeşil" "$H"
          swift ocr.swift $E/ios-rehber-sktt.png "SKTT" "$H"
          swift ocr.swift $E/ios-canli-ptf.png "PTF" "$H"
          swift ocr.swift $E/ios-elektrik-faturasi-hesaplama.png "4,71" "$H"
          swift ocr.swift $E/ios-kurumsal.png "Voltan" "$H"
          swift ocr.swift $E/ios-olmayan-sayfa-qa-yayin.png "404|Ana Sayfa" "$H"
          curl -s $B/__qa/raporlar > ../raporlar.json
          python3 - <<'PY'
          import json
          r=json.load(open('../raporlar.json'))
          print('Mobile Safari rapor sayısı:',len(r))
          for x in r:
              d=x.get('durum',{}); o={k:x[k] for k in ('menuAcik','menuKapali','ana','serit','isaret','yazi','bahar','hesap','tablo','hata') if k in x}
              if x.get('yol')=='/': print('  bahar', 'KAPALI' if x.get('baharsiz') else 'AÇIK', 'kare', x.get('bahar',{}).get('kare'), 'en uzun', x.get('bahar',{}).get('enUzunMs'), '>50', x.get('bahar',{}).get('uzun50'), '>100', x.get('bahar',{}).get('uzun100'), 'yazı gecikme en çok', (x.get('yazi') or [0,0])[1], 'ms · örtülü', x.get('bahar',{}).get('ortulu'), 'kesişim', x.get('bahar',{}).get('kesisim'), 'sonra süs', x.get('bahar',{}).get('sonraSus'))
              print(' ',x.get('yol'),'·',d.get('motor'),'·',d.get('w'),'px dpr',d.get('dpr'),'· taşma',d.get('tasma'),'· h1',d.get('h1'),'· atla',d.get('atla'),'· künye',d.get('kunye'),'· js hata',d.get('hata'),'· hareket azaltma',d.get('azalt'),'·',json.dumps(o,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios-ekran, path: '${{ runner.temp }}/ekran', retention-days: 1 }
