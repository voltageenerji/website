            if [ "$k" = 200 ] && [ "$x" -ge 1 ] && [ "$f" -ge 1 ]; then ok=$((ok+1)); else bad=$((bad+1)); echo "SORUN $p http=$k noindex=$x kunye=$f"; fi
          done
