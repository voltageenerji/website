      - name: Masaüstü CLS — /rehber ve /rehber/tekstil-elektrik, 7 koşu, önizleme ↔ üretim (Chromium 1440×900)
        working-directory: ${{ runner.temp }}/qa
        continue-on-error: true
        run: ADRESLER="rc=$TABAN prod=$URETIM" N=7 MODUL=$PWD/node_modules node cls.mjs
      - name: Masaüstü CLS — Lighthouse 12.6.1 masaüstü, 7 koşu
        working-directory: ${{ runner.temp }}/qa
        continue-on-error: true
        shell: bash {0}
        run: |
          export CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          for y in /rehber /rehber/tekstil-elektrik; do for ad in rc prod; do [ $ad = rc ] && B=$TABAN || B=$URETIM; v=""
            for i in 1 2 3 4 5 6 7; do ./node_modules/.bin/lighthouse "$B$y" --preset=desktop --only-categories=performance --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=lh.json --quiet >/dev/null 2>&1
              v="$v $(python3 -c "import json;a=json.load(open('lh.json'))['audits'];print('%.4f/%d/%d'%(a['cumulative-layout-shift']['numericValue'],a['largest-contentful-paint']['numericValue'],round(json.load(open('lh.json'))['categories']['performance']['score']*100)))" 2>/dev/null || echo hata)"; done
            echo "LH masaüstü $ad $y (CLS/LCP ms/skor):$v" | python3 -c "
          import sys,statistics as st
          l=sys.stdin.read().strip(); p=[x.split('/') for x in l.split(':',1)[1].split() if '/' in x]
          c=[float(x[0]) for x in p]; print(l); print('   medyan CLS %.4f · en çok %.4f · medyan LCP %d ms · medyan skor %d'%(st.median(c),max(c),st.median([int(x[1]) for x in p]),st.median([int(x[2]) for x in p])) if p else '   ölçüm yok')"
          done; done
      - name: Masaüstü CLS — 25 alt sayfanın hepsi, 3 koşu, önizleme ↔ üretim
        working-directory: ${{ runner.temp }}/qa
        continue-on-error: true
        run: SAYFALAR="/rehber/15-dakikalik-uzlastirma /rehber/cam-seramik-elektrik /rehber/demir-celik-elektrik /rehber/elektrik-faturasi-neden-yuksek /rehber/elektrik-tedarikcisi-nasil-secilir /rehber/i-rec-nedir /rehber/kapsam-2-elektrik-emisyonu /rehber/kimya-elektrik /rehber/osb-elektrik-tedariki /rehber/skdm-elektrik-sertifika /rehber/sktt /rehber/soguk-zincir-elektrik /rehber/veri-merkezi-elektrik /rehber/yek-g-i-rec-farki /rehber/yek-g-nedir /sanayi-elektrik-tedariki /elektrik-faturasi-hesaplama /canli-ptf /kurumsal /kvkk /cerez-politikasi /kullanim-kosullari /" ADRESLER="rc=$TABAN prod=$URETIM" N=3 MODUL=$PWD/node_modules node cls.mjs
      - name: Firefox (Playwright) ve WebKit (iPhone 15 öykünmesi)
        working-directory: ${{ runner.temp }}/qa
        shell: bash {0}
        run: |
          H=0
          for M in firefox webkit; do echo "== $M (gerçek EPİAŞ yanıtı, yalnız CORS başlığı eklenir)"; CORS_SIM=1 MOD=$M MODUL=$PWD/node_modules timeout 600 node gercek.mjs; k=$?; echo "$M çıkış $k"; [ $k -eq 0 ] || H=1; done
          exit $H

  macos-safari-ios:
