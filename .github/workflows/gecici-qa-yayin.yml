                await p.goto(taban + yol, { waitUntil: 'load', timeout: 60000 }); await p.waitForTimeout(4000);
                const r = await p.evaluate(() => { let en = 0, top = 0, bas = 0, son = 0; for (const [t, x] of window.__ls) { if (t - son > 1000 || t - bas > 5000) { bas = t; top = 0; } top += x; son = t; if (top > en) en = top; } const f = performance.getEntriesByType('resource').filter(e => /fonts\.gstatic/.test(e.name)).map(e => e.responseEnd); return [en, f.length ? Math.max(...f) : 0]; });
                v.push(r[0]); fontGec.push(r[1]); await c.close();
