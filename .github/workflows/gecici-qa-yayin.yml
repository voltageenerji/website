          k=$(curl -sS -o b.html -m 30 -w '%{http_code}' "$TABAN/olmayan-sayfa-qa-yayin"); echo "404 http=$k kunye=$(grep -c 'Kuruluş 2011' b.html)"
          for p in /docs/qa/README.md /CLAUDE.md /lib/admin-auth.js /tools/gsc-export.mjs /.github/workflows/lead-reports.yml; do echo "gizli $p http=$(curl -sS -o /dev/null -m 30 -w '%{http_code}' "$TABAN$p")"; done
