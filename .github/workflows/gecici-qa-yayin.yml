          QAEOF
          cat > cls.mjs <<'QAEOF'
          #!/usr/bin/env node
          // Masaüstü CLS (Chromium, 1440×900, soğuk önbellek, her koşu yeni bağlam): web-vitals oturum penceresi kuralıyla
          // (1 sn ara, 5 sn pencere) en büyük pencere; yükleme + 4 sn bekleme, kaydırma yok. Çıktı yalnız sayılar.
          //   SAYFALAR="/rehber /rehber/tekstil-elektrik" ADRESLER="rc=https://… prod=https://…" N=7 MODUL=… node cls.mjs
          import { createRequire } from 'node:module';
          const req = createRequire((process.env.MODUL || process.cwd() + '/node_modules').replace(/\/?$/, '/'));
          const { chromium } = req('playwright');
          const N = +(process.env.N || 7);
          const SAYFALAR = (process.env.SAYFALAR || '/rehber /rehber/tekstil-elektrik').split(' ');
          const ADRES = Object.fromEntries(process.env.ADRESLER.split(' ').map(x => x.split('=')));
          const med = (a) => { const s = [...a].sort((x, y) => x - y), n = s.length; return n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2; };
