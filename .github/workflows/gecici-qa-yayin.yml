          mkdir -p qa ekran && cd qa && npm init -y >/dev/null
          cat > olcum.js <<'QAEOF'
          /* QA ölçüm modülü (sayfaya executeScript ile eklenir; sayfa içeriği döndürmez, yalnız sayılar ve doğru/yanlış) */
          (function () {
