            }
          }
          await b.close();
          process.exit(kotu ? 1 : 0);
          QAEOF
          npm install --no-audit --no-fund "playwright@${PW_SURUM}" "lighthouse@12.6.1" >/dev/null 2>&1; echo "npm $?"
          npx playwright install --with-deps chromium firefox webkit >/dev/null 2>&1; echo "tarayıcı kurulumu $?"
      - name: Önizleme durum kodları ve başlıklar (yalnız sayılar)
