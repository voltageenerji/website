# GEÇİCİ QA iş akışı — yeni tasarım yayın adayı (RC 4bf70d5, önizleme https://4a382727.website-dh5.pages.dev; masaüstü CLS önizleme ↔ üretim):
# gerçek Safari (safaridriver), iOS Simülatörü'nde Mobile Safari, Firefox ve WebKit (iPhone 15 öykünmesi).
# İş bitince bu dosya bir sonraki commit ile SİLİNİR (CLAUDE.md kural 6). Form GÖNDERİLMEZ. Günlüğe yalnız denetim
# adları, geçti/kaldı ve sayılar basılır (sayfa gövdesi yok). Ekran görüntüleri (herkese açık sayfalar, kişisel veri
# yok) 1 günlük artefakt.
name: gecici-qa-yayin
on:
  push:
    branches: [claude/voltan-orchestrator-agent-a30dgt]
    paths: ['.github/workflows/gecici-qa-yayin.yml']
permissions: {}
concurrency:
  group: gecici-qa-yayin
  cancel-in-progress: true
env:
  TABAN: https://4a382727.website-dh5.pages.dev
  URETIM: https://website-dh5.pages.dev
  PW_SURUM: 1.64.1
  SELENIUM_SURUM: 4.52.0

jobs:
  linux-firefox-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Betikler ve Playwright (geçici dizinde)
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p qa && cd qa && npm init -y >/dev/null
          cat > olcum.js <<'QAEOF'
          /* QA ölçüm modülü (sayfaya executeScript ile eklenir; sayfa içeriği döndürmez, yalnız sayılar ve doğru/yanlış) */
          (function () {
            if (window.__qa) return;
            var D = document, W = window;
            function gor(e) { if (!e) return false; var r = e.getBoundingClientRect(), c = getComputedStyle(e); return r.width > 0 && r.height > 0 && c.visibility !== 'hidden' && c.display !== 'none'; }
            function tx(e) { var m = getComputedStyle(e).transform; if (!m || m === 'none') return 0; var v = m.match(/matrix(3d)?\(([^)]+)\)/); if (!v) return 0; var a = v[2].split(',').map(parseFloat); return v[1] ? a[12] : a[4]; }
            var KONTROL = '#leadForm input:not([type=hidden]):not([type=file]), #leadForm select, #leadForm textarea, #leadSubmit, #leadForm .dosya-dugme';
            function kontroller() { return [].slice.call(D.querySelectorAll(KONTROL)).filter(function (e) { return !e.closest('.hp-field') && gor(e); }); }
            /* Denetimin isabet hedefi: kendisi, içindekiler ya da kendi etiketi (gizli kutucuklarda etiket tıklanır) */
            function isabet(e) {
              var r = e.getBoundingClientRect(); var x = r.left + r.width / 2, y = r.top + r.height / 2;
              if (y < 0 || y > innerHeight || x < 0 || x > innerWidth) return null;
              var h = D.elementFromPoint(x, y); if (!h) return false;
              if (h.closest && h.closest('.bh-kat')) return 'sus';
              if (h === e || e.contains(h)) return true;
              var l = h.closest('label'); if (l && (l.htmlFor === e.id || l.contains(e))) return true;
              return false;
            }
            var qa = {
              durum: function () {
                var de = D.documentElement, f = D.querySelector('footer'), s = D.querySelector('a.skip');
                var ua = navigator.userAgent, ios = (ua.match(/OS (\d+)_(\d+)/) || []), saf = (ua.match(/Version\/([\d.]+)/) || []), ff = (ua.match(/Firefox\/([\d.]+)/) || []);
                return {
                  w: innerWidth, cw: de.clientWidth, dpr: devicePixelRatio, tasma: de.scrollWidth - de.clientWidth,
                  motor: ff[1] ? 'Firefox ' + ff[1] : (ios[1] ? 'iOS ' + ios[1] + '.' + ios[2] + ' Safari ' + (saf[1] || '?') : 'Safari ' + (saf[1] || '?')),
                  h1: D.querySelectorAll('h1').length, nav: !!D.querySelector('.nav-links'), menuDugme: !!D.getElementById('mobileMenuBtn'),
                  kunye: !!f && /Kuruluş 2011 · EPİAŞ Piyasa Katılımcısı|Est\. 2011 · EPIAS Market Participant/.test(f.textContent.replace(/\s+/g, ' ')),
                  atla: !!s && s.getAttribute('href') === '#icerik' && /^(İçeriğe atla|Skip to content)$/.test(s.textContent.trim()) && !!D.getElementById('icerik'),
                  hata: (W.__qaHata || []).length, azalt: matchMedia('(prefers-reduced-motion: reduce)').matches
                };
              },
              menu: function () { var b = D.getElementById('mobileMenuBtn'), m = D.getElementById('mobileMenu'); return { dugmeGorunur: gor(b), acik: !!m && !m.hidden && gor(m), aria: b ? b.getAttribute('aria-expanded') : null, baglanti: m ? [].slice.call(m.querySelectorAll('a')).filter(gor).length : 0 }; },
              ana: function () {
                var k = D.getElementById('kfPtf'), st = D.getElementById('kfStamp'), kart = D.getElementById('ptfKart'), rail = D.getElementById('mcpRail'), tr = D.getElementById('mcpTrack');
                var t = k ? k.textContent.replace(/\s+/g, ' ').trim() : '';
                var hucre = [].slice.call(D.querySelectorAll('#saatTablo tbody td')).map(function (c) { return c.textContent.trim(); });
                var sayi = /^\d{1,3}(\.\d{3})*(,\d{1,2})?$/;
                var sifir = function (v) { return /^0+([.,]0+)?$/.test(v.replace(/[^\d.,]/g, '')) && /\d/.test(v); };
                var bolum = ['kapak', 'hizmetler', 'yaklasim', 'canli-piyasa', 'hakkimizda', 'leadForm', 'iletisim'].map(function (i) { var e = D.getElementById(i); return !!e && e.getBoundingClientRect().height > 40; });
                return {
                  kart: kart ? kart.getAttribute('data-state') : null,
                  ptfBicim: t === '—' ? 'tire' : (sayi.test(t.replace(/\s*(₺|TL).*$/, '').replace(/[^\d.,]/g, '')) ? 'sayi' : 'diger'), ptfSifir: sifir(t),
                  damga: st ? (/^(SAAT \d\d:00 · EPİAŞ|HOUR \d\d:00 · EPİAŞ)$/.test(st.textContent.trim()) ? 'canli' : (/^(SON SENKRON|LAST SYNC)/.test(st.textContent.trim()) ? 'son-senkron' : (/BEKLEN|AWAITING/.test(st.textContent) ? 'bekleme' : 'diger'))) : null,
                  saat: { toplam: hucre.length, tire: hucre.filter(function (v) { return v === '—'; }).length, sayi: hucre.filter(function (v) { return sayi.test(v); }).length, sifir: hucre.filter(sifir).length },
                  serit: { gizli: rail ? rail.hidden : null, hucre: tr ? tr.querySelectorAll('.cell').length : 0, sifirHucre: tr ? [].slice.call(tr.querySelectorAll('.cell b')).filter(function (b) { return sifir(b.textContent); }).length : 0, dugme: !!D.getElementById('mcpDur') },
                  bolum: bolum.filter(Boolean).length + '/' + bolum.length
                };
              },
              serit: function (ms, bitti) { var tr = D.getElementById('mcpTrack'); if (!tr) return bitti({ yol: 0 }); var a = tx(tr), t0 = performance.now(); setTimeout(function () { bitti({ yol: Math.round(Math.abs(tx(tr) - a)), sure: Math.round(performance.now() - t0) }); }, ms); },
              /* Bahar ölçümü: her karede süs sayısı, kare aralıkları, denetimlerin örtülmesi, denetim/form kayması, yatay taşma */
              baharBasla: function (sure) {
                var f = D.getElementById('leadForm'); var k0 = kontroller(); var ilk = k0.map(function (e) { var r = e.getBoundingClientRect(); return [r.left + scrollX, r.top + scrollY, r.width, r.height]; });
                var fr0 = f.getBoundingClientRect(), fy0 = fr0.top + scrollY, fh0 = fr0.height, boy0 = D.documentElement.scrollHeight;
                var S = W.__qaB = { kesisim: 0, kesisimOrnek: 0, kesisimOge: {}, kare: 0, enUzun: 0, uzun50: 0, uzun100: 0, enCokSus: 0, katMax: 0, ortulu: 0, ortuluOrnek: 0, kontrol: k0.length, kayma: 0, formKayma: 0, boyFark: 0, tasma: 0, sx: 0, bitti: false, t0: performance.now() };
                var son = performance.now();
                (function tur(simdi) {
                  var g = simdi - son; son = simdi; S.kare++; if (g > S.enUzun) S.enUzun = g; if (g > 50) S.uzun50++; if (g > 100) S.uzun100++;
                  var n = D.querySelectorAll('.bh-kat [class^="bh-"], .bh-kat [class*=" bh-"]').length; if (n > S.enCokSus) S.enCokSus = n;
                  var kat = D.querySelectorAll('.bh-kat').length; if (kat > S.katMax) S.katMax = kat;
                  if (S.kare % 3 === 0) {
                    var sus = [].slice.call(D.querySelectorAll('.bh-kat > div')).map(function (x) { var q = x.getBoundingClientRect(); return [q.left, q.top, q.right, q.bottom, x.className]; }).filter(function (q) { return q[2] > q[0]; });
                    k0.concat([].slice.call(D.querySelectorAll('#leadForm label, #leadForm .form-label'))).forEach(function (e) { var q = e.getBoundingClientRect(); if (q.width === 0) return; sus.forEach(function (z) { S.kesisimOrnek++; var ix = Math.min(q.right, z[2]) - Math.max(q.left, z[0]), iy = Math.min(q.bottom, z[3]) - Math.max(q.top, z[1]); if (ix > 2 && iy > 2) { S.kesisim++; var ad = (e.id || e.className.split(' ')[0]) + '×' + z[4].split(' ')[0]; S.kesisimOge[ad] = (S.kesisimOge[ad] || 0) + 1; } }); });
                    k0.forEach(function (e, i) { var h = isabet(e); if (h === null) return; S.ortuluOrnek++; if (h === 'sus') S.ortulu++; else if (h === false) S.digerOrtu = (S.digerOrtu || 0) + 1; var r = e.getBoundingClientRect(); var d = Math.max(Math.abs(r.left + scrollX - ilk[i][0]), Math.abs(r.top + scrollY - ilk[i][1]), Math.abs(r.width - ilk[i][2]), Math.abs(r.height - ilk[i][3])); if (d > S.kayma) S.kayma = d; }); }
                  var fr = f.getBoundingClientRect(); S.formKayma = Math.max(S.formKayma, Math.abs(fr.top + scrollY - fy0), Math.abs(fr.height - fh0)); S.boyFark = Math.max(S.boyFark, Math.abs(D.documentElement.scrollHeight - boy0));
                  S.tasma = Math.max(S.tasma, D.documentElement.scrollWidth - D.documentElement.clientWidth); S.sx = Math.max(S.sx, f.scrollLeft, D.documentElement.scrollLeft);
                  if (simdi - S.t0 < sure) requestAnimationFrame(tur); else S.bitti = true;
                })(performance.now());
                return k0.length;
              },
              baharSonuc: function () {
                var S = W.__qaB || {}; var f = D.getElementById('leadForm'), b = D.getElementById('leadSubmit');
                b.scrollIntoView({ block: 'center', behavior: 'instant' }); var r = b.getBoundingClientRect(); var h = D.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
                return { kare: S.kare, enUzunMs: Math.round(S.enUzun), uzun50: S.uzun50, uzun100: S.uzun100, enCokSus: S.enCokSus, katMax: S.katMax, ortulu: S.ortulu, ortuluOrnek: S.ortuluOrnek, digerOrtu: S.digerOrtu || 0, kesisim: S.kesisim, kesisimOrnek: S.kesisimOrnek, kesisimOge: S.kesisimOge, kontrol: S.kontrol, kaymaPx: +S.kayma.toFixed(1), formKaymaPx: +S.formKayma.toFixed(1), boyFark: S.boyFark, tasma: S.tasma, sx: S.sx, bitti: S.bitti,
                  sonraSus: D.querySelectorAll('[class^="bh-"], [class*=" bh-"]').length, sonraKat: D.querySelectorAll('.bh-kat').length, yesil: f.classList.contains('yesil'), gonderUlasilir: !!h && (h === b || b.contains(h)), gonderEtkin: !b.disabled };
              },
              deger: function (id) { var e = D.getElementById(id); return e ? e.value.length : -1; },
              hesap: function () { /* fatura hesaplama: 1. araç sonucu (yalnız birim maliyet sayısı biçimi ve ok/warn sınıfı) */
                var o = D.getElementById('t1Out'), o2 = D.getElementById('t2Out'), o3 = D.getElementById('t3Out');
                var t = o ? o.textContent.replace(/\s+/g, ' ') : '';
                return { t1Sinif: o ? o.className : null, t1Birim: (t.match(/(\d+,\d{2,4})\s*(TL|₺)\s*\/\s*kWh/) || [])[1] || null, t2Satir: o2 ? o2.querySelectorAll('tr, li').length : 0, t3Sinif: o3 ? o3.className : null };
              }
            };
            W.__qa = qa;
          })();
          QAEOF
          cat > gercek.mjs <<'QAEOF'
          #!/usr/bin/env node
          // Gerçek tarayıcı turu (yayın adayı): Safari (safaridriver), iOS Simülatörü Safari (safaridriver useSimulator) ya da
          // Firefox (Playwright). Çıktı YALNIZ denetim adları, geçti/kaldı ve sayılar; sayfa metni basılmaz. Form gönderilmez.
          //   MOD=safari|ios|firefox TABAN=<adres> [MODUL=<node_modules>] node gercek.mjs
          import { createRequire } from 'node:module';
          import { readFileSync } from 'node:fs';
          const MOD = process.env.MOD || 'safari';
          const TABAN = (process.env.TABAN || '').replace(/\/$/, '');
          const req = createRequire((process.env.MODUL || process.cwd() + '/node_modules').replace(/\/?$/, '/'));
          const OLCUM = readFileSync(new URL('./olcum.js', import.meta.url), 'utf8');
          let gecti = 0, kaldi = 0;
          const ok = (ad, kosul, sayi) => { if (kosul) gecti++; else kaldi++; console.log(`  ${kosul ? 'GECTI' : 'KALDI'} ${ad}${sayi !== undefined ? ' · ' + JSON.stringify(sayi) : ''}`); };
          const not = (s) => console.log(`  NOT ${s}`);
          const bekle = (ms) => new Promise(r => setTimeout(r, ms));

          // --- sürücü bağdaştırıcısı: ortak işlemler ---
          let A, A0;
          const PW = ['firefox', 'chromium', 'webkit'].includes(MOD);
          if (PW) {
            const pw = req('playwright');
            const b = await pw[MOD].launch();
            const ctx = await b.newContext(MOD === 'webkit' ? { ...pw.devices['iPhone 15'], locale: 'tr-TR' } : { viewport: { width: 1280, height: 900 }, locale: 'tr-TR' });
            A0 = { b, pw };
            if (process.env.YEREL_TAKLIT) { // yalnız yerel hata ayıklama: UYDURMA 24 saat (eksik 5. saat)
              await ctx.route('https://epias-proxy.emirhantan-ku.workers.dev/**', (r) => { const u = r.request().url(); const it = []; for (let h = 0; h < 24; h++) if (h !== 5) it.push({ hour: h, price: 2000 + h * 10 }); return r.fulfill({ status: 200, contentType: 'application/json', headers: { 'access-control-allow-origin': '*' }, body: JSON.stringify(u.endsWith('/ptf/stats') ? { monthAvg: 2345.67, monthRange: '2026-11-01..26' } : { items: it, date: new Date().toISOString().slice(0, 10) }) }); });
              await ctx.route(/fonts\.(googleapis|gstatic)\.com/, (r) => r.abort());
            }
            const p = await ctx.newPage();
            p.on('pageerror', (e) => { p.__hata = (p.__hata || 0) + 1; console.log('  NOT sayfa hatası: ' + String(e && e.message).slice(0, 140).replace(/https?:\/\/\S+/g, '<adres>')); });
            if (process.env.CORS_SIM) { // yalnız test: önizleme kökeni proxy'nin CORS listesinde yok; GERÇEK yanıt aynen, yalnız ACAO eklenir
              await ctx.route('https://epias-proxy.emirhantan-ku.workers.dev/**', async (r) => { try { const y = await r.fetch(); return r.fulfill({ status: y.status(), body: await y.body(), headers: { 'content-type': y.headers()['content-type'] || 'application/json', 'access-control-allow-origin': '*' } }); } catch { return r.abort(); } });
            }
            A = {
              ad: MOD, get: async (u) => { await p.goto(u, { waitUntil: 'load', timeout: 45000 }); await p.evaluate(OLCUM); },
              js: (f, ...a) => p.evaluate(([f, a]) => (0, eval)('(' + f + ')').apply(null, a), [f.toString(), a]),
              jsAsync: (f, ...a) => p.evaluate(([f, a]) => new Promise(r => (0, eval)('(' + f + ')').apply(null, [...a, r])), [f.toString(), a]),
              tikla: (s) => p.click(s, { timeout: 5000 }), yaz: (s, t) => p.locator(s).pressSequentially(t, { timeout: 5000 }), tus: (k) => p.keyboard.press(k),
              boyut: (w, h) => p.setViewportSize({ width: w, height: h }), kapat: () => b.close(), sayfaHata: () => p.__hata || 0,
              dosya: (s, f) => p.setInputFiles(s, f)
            };
          } else {
            const { Builder, By, Key } = req('selenium-webdriver');
            const safari = req('selenium-webdriver/safari');
            const o = new safari.Options();
            if (MOD === 'ios') { o.set('platformName', 'iOS'); o.set('safari:useSimulator', true); o.set('safari:deviceType', 'iPhone'); if (process.env.IOS_UDID) o.set('safari:deviceUDID', process.env.IOS_UDID); }
            const d = await new Builder().forBrowser('safari').setSafariOptions(o).build();
            await d.manage().setTimeouts({ script: 30000, pageLoad: 60000 });
            const bul = (s) => d.findElement(By.css(s));
            A = {
              ad: MOD === 'ios' ? 'iOS Simülatörü Safari' : 'Safari', get: async (u) => { await d.get(u); await d.executeScript(OLCUM); },
              js: (f, ...a) => d.executeScript('return (' + f.toString() + ').apply(null, arguments)', ...a),
              jsAsync: (f, ...a) => d.executeAsyncScript('var a=[].slice.call(arguments);(' + f.toString() + ').apply(null, a)', ...a),
              tikla: async (s) => { await d.executeScript('arguments[0].scrollIntoView({block:"center",behavior:"instant"})', await bul(s)); await (await bul(s)).click(); },
              yaz: async (s, t) => (await bul(s)).sendKeys(t), tus: async (k) => d.actions().sendKeys(Key[k.toUpperCase()] || k).perform(),
              boyut: async (w, h) => { if (MOD !== 'ios') await d.manage().window().setRect({ width: w, height: h }); }, kapat: () => d.quit(), sayfaHata: () => 0,
              caps: () => d.getCapabilities()
            };
          }

          try {
            if (A.caps) { const c = await A.caps(); console.log(`# ${A.ad} ${c.get('browserVersion')} · ${c.get('platformName')}`); }
            const genislik = (MOD === 'ios' || MOD === 'webkit') ? [null] : [1280, 390];
            // 1) Ana sayfa
            for (const w of genislik) {
              if (w) await A.boyut(w, 900);
              await A.get(TABAN + '/');
              await bekle(7000); // canlı veri ve şerit
              const d0 = await A.js(() => window.__qa.durum());
              console.log(`# ana sayfa · ${d0.motor} · pencere ${d0.w} px (istemci ${d0.cw}) · dpr ${d0.dpr} · hareket azaltma tercihi ${d0.azalt ? 'AÇIK' : 'kapalı'}`);
              const etiket = `ana ${d0.cw}px`;
              ok(`${etiket}: yatay taşma yok`, d0.tasma <= 0, d0.tasma);
              ok(`${etiket}: tek h1, atla bağlantısı (#icerik), künye "Kuruluş 2011 · EPİAŞ Piyasa Katılımcısı"`, d0.h1 === 1 && d0.atla && d0.kunye, [d0.h1, d0.atla, d0.kunye]);
              const a = await A.js(() => window.__qa.ana());
              ok(`${etiket}: bölümler görünür`, a.bolum === '7/7', a.bolum);
              ok(`${etiket}: PTF kartı dürüst (canlı→sayı, değilse "—"; sıfır yok)`, !a.ptfSifir && ((a.kart === 'live' && a.ptfBicim === 'sayi' && a.damga === 'canli') || (a.kart === 'cached' && a.ptfBicim === 'sayi' && a.damga === 'son-senkron') || (a.kart === 'waiting' && a.ptfBicim === 'tire' && a.damga === 'bekleme')), [a.kart, a.ptfBicim, a.damga]);
              ok(`${etiket}: saatlik tablo 24 hücre, yalnız sayı ya da "—", sıfır yok`, a.saat.toplam === 24 && a.saat.tire + a.saat.sayi === 24 && a.saat.sifir === 0, a.saat);
              if (a.serit.gizli === false) {
                const s = await A.jsAsync((ms, bitti) => window.__qa.serit(ms, bitti), 2000);
                const dg = await A.js(() => { const d = document.getElementById('mcpDur'); return !!d && d.getBoundingClientRect().width > 0 && getComputedStyle(d).display !== 'none'; });
                if (d0.azalt) ok(`${etiket}: hareket azaltma tercihinde şerit durur, durdur düğmesi gizli; sıfır fiyat yok`, s.yol < 1 && !dg && a.serit.sifirHucre === 0, [a.serit.hucre, s.yol, dg]);
                else ok(`${etiket}: şerit görünür ve akıyor (2 sn'de ≥ 20 px), sıfır fiyat yok`, s.yol >= 20 && a.serit.sifirHucre === 0, [a.serit.hucre, s.yol, a.serit.sifirHucre]);
              } else not(`${etiket}: şerit gizli (canlı veri yok → dürüst: ray gösterilmez) hücre=${a.serit.hucre}`);
              // Menü (dar ekranda)
              const m0 = await A.js(() => window.__qa.menu());
              if (m0.dugmeGorunur) {
                await A.tikla('#mobileMenuBtn'); await bekle(400);
                const m1 = await A.js(() => window.__qa.menu());
                await A.tus('Escape'); await bekle(300);
                const m2 = await A.js(() => window.__qa.menu());
                ok(`${etiket}: mobil menü açılır (aria-expanded), bağlantılar görünür, Esc kapatır`, m1.acik && m1.aria === 'true' && m1.baglanti >= 4 && !m2.acik && m2.aria === 'false', [m1.acik, m1.aria, m1.baglanti, m2.acik]);
              } else not(`${etiket}: menü düğmesi bu genişlikte görünmüyor (masaüstü gezinme)`);
              // Teklif formu + bahar anı (gönderilmez)
              await A.js(() => { const k = document.getElementById('lead-yesil'); k.scrollIntoView({ block: 'center', behavior: 'instant' }); window.scrollBy({ top: 120, behavior: 'instant' }); });
              await A.tikla('#lead-ad'); await A.yaz('#lead-ad', 'Deneme');
              await A.yaz('#lead-sirket', 'QA Test');
              await A.yaz('#lead-eposta', 'qa@example.com');
              await A.js(() => { const k = document.getElementById('lead-yesil'); k.scrollIntoView({ block: 'center', behavior: 'instant' }); });
              const kn = await A.js(() => window.__qa.baharBasla(7000));
              const t0 = Date.now();
              try { await A.tikla('#lead-yesil'); } catch { await A.tikla('label.form-green'); }
              const isaret = await A.jsAsync((bitti) => { const t = performance.now(); (function d() { const n = document.querySelectorAll('.bh-kat').length; if (n || performance.now() - t > 500) bitti([document.getElementById('lead-yesil').checked, n, Math.round(performance.now() - t)]); else requestAnimationFrame(d); })(); });
              // etki sürerken yazma ve tıklama
              const t1 = Date.now(); await A.tikla('#lead-mesaj'); await A.yaz('#lead-mesaj', 'Bahar sirasinda yazi'); const yazMs = Date.now() - t1;
              await A.tikla('#lead-soyad'); await A.yaz('#lead-soyad', 'Test');
