          let kotu = 0;
          for (const yol of SAYFALAR) {
            for (const [ad, taban] of Object.entries(ADRES)) {
              const v = [], fontGec = [];
              for (let i = 0; i < N; i++) {
                const c = await b.newContext({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
                const p = await c.newPage();
