# GEÇİCİ TANI — canlı PTF verisi neden gelmiyor?
# GitHub'ın ağından epias-proxy Worker'ını, canlı siteyi ve EPİAŞ uç noktasını
# yoklar; yalnızca HTTP durumlarını ve yanıt başlarını yazdırır. Hiçbir secret
# kullanmaz, hiçbir şeyi değiştirmez. Tanı bitince silinecek.
# Çalıştırma 2: şifre güncellemesi sonrası doğrulama.
name: PTF Proxy Probe

on:
  push:
    branches: [claude/voltan-orchestrator-agent-a30dgt]
    paths: ['.github/workflows/ptf-proxy-probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: DNS
        run: |
          for h in epias-proxy.emirhantan-ku.workers.dev voltage.com.tr seffaflik.epias.com.tr giris.epias.com.tr; do
            echo "== $h"; getent hosts "$h" || echo "DNS COZULEMEDI: $h"
          done

      - name: Proxy uclari
        run: |
          P=https://epias-proxy.emirhantan-ku.workers.dev
          for path in /ptf/today /ptf/stats /; do
            echo "=================== GET $path"
            curl -sS -i -m 25 -H 'Origin: https://voltage.com.tr' "$P$path" | head -c 2500 || echo "CURL HATASI: $?"
            echo
          done
          echo "=================== /ptf/today icerik ozeti"
          curl -sS -m 25 -H 'Origin: https://voltage.com.tr' "$P/ptf/today" | jq -c '{saat_sayisi: (.items|length), ilk: .items[0], son: .items[-1], diger_alanlar: (del(.items)|keys)}' || echo "JSON OKUNAMADI"
          echo "=================== /ptf/stats"
          curl -sS -m 25 -H 'Origin: https://voltage.com.tr' "$P/ptf/stats" | head -c 600; echo

      - name: Canli site SSR durumu
        run: |
          for u in https://voltage.com.tr/ https://voltage.com.tr/canli-ptf; do
            echo "=================== $u"
            curl -sS -o page.html -w 'HTTP %{http_code}  %{time_total}s\n' -m 25 "$u" || echo "CURL HATASI"
          done
          echo "--- canli-ptf SSR isaretleri"
          grep -o 'data-ssr="1"' page.html || echo "data-ssr YOK (sunucu veri cekemedi)"
          grep -o '<span[^>]*id="pMode"[^>]*>[^<]*' page.html || true
          grep -o '<span[^>]*id="pStamp"[^>]*>[^<]*' page.html || true
          grep -o '<p class="day-sum" id="pSum">[^<]*' page.html || true
          grep -o '<div class="cv" id="pMo">[^<]*' page.html || true

      - name: EPIAS uc noktasi (kimliksiz; yalnizca erisim ve beklenen 401)
        run: |
          D=$(TZ=Europe/Istanbul date +%Y-%m-%d)
          echo "=================== POST mcp $D (TGT'siz)"
          curl -sS -i -m 25 -X POST -H 'Content-Type: application/json' \
            -d "{\"startDate\":\"${D}T00:00:00+03:00\",\"endDate\":\"${D}T00:00:00+03:00\"}" \
            https://seffaflik.epias.com.tr/electricity-service/v1/markets/dam/data/mcp | head -c 1500 || echo "CURL HATASI"
          echo
          echo "=================== CAS giris noktasi"
          curl -sS -o /dev/null -w 'HTTP %{http_code}\n' -m 25 https://giris.epias.com.tr/cas/v1/tickets || echo "CURL HATASI"
