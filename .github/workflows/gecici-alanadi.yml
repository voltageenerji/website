name: gecici-alanadi
on:
  push:
    branches: [claude/voltan-orchestrator-agent-a30dgt]
    paths: [.github/workflows/gecici-alanadi.yml]
permissions: {}
jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: DNS ve HTTP
        run: |
          for d in voltan.com www.voltan.com voltan.com.tr www.voltan.com.tr voltage.com.tr www.voltage.com.tr; do
            echo "=== $d"
            echo "NS:    $(dig +short NS $d | tr '\n' ' ')"
            echo "CNAME: $(dig +short CNAME $d | tr '\n' ' ')"
            echo "A:     $(dig +short A $d | tr '\n' ' ')"
            for s in http https; do
              r=$(curl -sS -o /dev/null -m 15 -w '%{http_code} -> %{redirect_url}' "$s://$d/" 2>&1 | tail -1)
              echo "$s:// $r"
            done
            echo "yol:   $(curl -sS -o /dev/null -m 15 -w '%{http_code} -> %{redirect_url}' "https://$d/rehber/ptf-nedir?x=1" 2>&1 | tail -1)"
          done
          echo "=== zone NS voltan.com.tr parent"; dig +short NS com.tr | head -2
          echo "=== whois-free: SOA"; for d in voltan.com voltan.com.tr; do echo "$d SOA: $(dig +short SOA $d)"; done
